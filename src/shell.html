   Área de trabalho clara por padrão e escuro de verdade; fundo cinza neutro, superfícies brancas com borda fina e sombra discreta;
   DM Sans; laranja Rixel SÓ na ação primária, no indicador da etapa/item ativo e em indicadores vivos; situações em cores funcionais suaves.
   Estrutura: trilho de etapas (o processo) · inspetor da etapa · palco (maquete, plantas, simulações) com régua de indicadores.

   Tokens em três camadas:
   1. base Rixel  (--brand*, --sel*, --soft, --faint, --ok/--warn/--bad/--info + *-soft, raios --r-*, sombras, --ease, fontes)
   2. nomes antigos que o código lê (--bg, --surface*, --ink*, --muted, --line*, --accent*, --mark, --glass*, --shadow*, --f-*) → mapeados na base
   3. desenho técnico 2D/3D (--m-*, --u1..5, --c-*, --lz-*, --ctx-*, --ctx3-*, --stage-*, --d-acc) — lidos por plan2d/view3d via getComputedStyle */
:root{
  /* ---- base Rixel · claro ---- */
  --brand:#e8702a; --brand-hover:#d4621f; --brand-ink:#ffffff; --brand-soft:rgba(232,112,42,.11);
  --sel:#1d1d1f; --sel-ink:#ffffff; --sel-soft:rgba(29,29,31,.06);
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --surface-3:#ebebef; --soft:#f0f0f3; --field:#ffffff; --seg-on:#ffffff;
  --ink:#1d1d1f; --ink-2:#3a3a3e; --muted:#6e6e73; --faint:#a1a1a6; --line:#e4e4e9; --line-2:#d2d2d7;
  --ok:#1f9d55; --ok-soft:rgba(31,157,85,.12); --warn:#b8740f; --warn-soft:rgba(201,134,22,.14); --bad:#d0342c; --bad-soft:rgba(208,52,44,.11); --info:#2f6fed; --info-soft:rgba(47,111,237,.11); --neutral-soft:rgba(29,29,31,.07);
  --shadow-s:0 1px 2px rgba(16,16,20,.05); --shadow-card:0 1px 2px rgba(16,16,20,.04),0 2px 8px rgba(16,16,20,.04);
  --shadow:0 10px 30px rgba(16,16,20,.10),0 1px 3px rgba(16,16,20,.06); --shadow-pop:0 24px 60px rgba(16,16,20,.18),0 2px 8px rgba(16,16,20,.08);
  --glass:rgba(255,255,255,.86); --glass-line:rgba(29,29,31,.08);
  --logo-tile:#ffffff; --logo-glyph:#000000;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px; --ease:cubic-bezier(.2,.7,.2,1); --topbar-h:60px;
  --f-sans:"DM Sans","DM Sans Variable",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* ---- nomes antigos → base (o código lê estes) ---- */
  --accent:var(--sel); --accent-2:var(--sel-soft); --accent-ink:var(--sel-ink);
  --f-display:var(--f-sans); --f-body:var(--f-sans); --f-mono:var(--f-sans);
  /* ---- desenho técnico: neutros da Rixel + matizes funcionais suaves ---- */
  --d-acc:#2f6fed; --mark:#cf9a1c;   /* --d-acc: destaque do desenho (acesso de pedestres, PCD, seleção) · --mark: marcação técnica âmbar (frente, rampa, pontos) — nunca na interface */
  --m-sub:#8e8e93; --m-gar:#bcbcc1; --m-ter:#a3bcd3; --m-tipo:#fbfbfa; --m-lote:#dfe6d7; --m-env:#d0342c; --m-loja:#dcbb8f; --m-cob:#d5c6a3; --m-viz:#c7c7cc;

  --c-circ:#ececef; --c-sac:#cddde9; --c-esc:#efeae1; --c-ant:#e5eaef; --c-duto:#f2e6c4; --c-balc:#dcece5; --c-elev:#d8d8dd; --c-emerg:#f1dad2; --c-shaft:#e1e1e5; --c-hall:#ffffff; --c-tec:#f0f0f2; --c-pass:#ffffff; --c-lixo:#e7e3db; --c-hserv:#f5f5f7; --c-drive:#d9d9de; --lz-c:#d7e6cf; --lz-agua:#aad4e3; --lz-deck:#e9d9be;
  --stage-a:#fbfbfc; --stage-b:#e9e9ed;
  --ctx-mar:#bfd6e2; --ctx-agua:#b6d0dd; --ctx-agua-l:#90b3c4; --ctx-areia:#ece4cf; --ctx-verde:#d5e2c8; --ctx-mata:#c0d3b0; --ctx-asf:#c9c9ce; --ctx-asf-l:#b2b2b8; --ctx-cal:#e6e6ea; --ctx-ciclo:#d8b3a7; --ctx-estac:#dadade; --ctx-praca:#e9e5dc; --ctx-casa:#ece4d7; --ctx-telha:#b8846d; --ctx-res:#d5d5da; --ctx-com:#cacfd7; --ctx-out:#d6d4ce; --ctx3-asf:#616166; --ctx3-cal:#bebec0; --ctx3-agua:#4d8aa1; --ctx3-mar:#3d7a93; --ctx3-areia:#e2d6b8; --ctx3-verde:#9db786; --ctx3-mata:#7c9a68; --ctx3-estac:#7e7e83; --ctx3-praca:#cbc7bc;
  color-scheme:light;
}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit;font-feature-settings:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--brand-soft)}
code,kbd,.code{font-family:var(--f-code);font-size:.92em}

/* ===== estrutura ===== */
.app{display:grid;grid-template-columns:78px 384px minmax(0,1fr);grid-template-rows:var(--topbar-h) minmax(0,1fr);height:100%}
.app>*{min-width:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px 0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
/* marca: ícone Rixel + "gabarito." no tratamento da .brand da Rixel + selo "by Rixel" */
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--ink);text-decoration:none;flex:none}
.brand .rx-ic,.rx-ic{width:24px;height:24px;flex:none;display:block}
.rx-ic .t{fill:var(--logo-tile)}.rx-ic .g{fill:var(--logo-glyph);stroke:var(--logo-glyph);stroke-width:2;stroke-linejoin:round}
.brand .wm{font-size:21px;font-weight:650;letter-spacing:-.06em;line-height:1;padding-bottom:1px}
.brand .wm i{font-style:normal;color:var(--brand);margin-left:-1px}
.brand .by{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:2px;padding-top:2px}
.top .sep{width:1px;height:22px;background:var(--line)}
.top .proj{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .proj input{border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 9px;font-weight:550;font-size:14px;letter-spacing:-.01em;min-width:0;width:min(320px,100%);text-overflow:ellipsis;transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease)}
.top .proj input:hover{background:var(--soft)}
.top .proj input:focus{background:var(--field);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.top .acts{display:flex;gap:6px;align-items:center}
.top .hist{display:flex;gap:2px;flex:none}
.top .hist .btn.icon{padding:6px 7px;color:var(--ink-2)}
.top .hist .btn.icon svg{width:17px;height:17px}
.top .hist .btn:disabled{opacity:.3}
.top .hist .btn:not(:disabled):hover{color:var(--ink)}
/* régua de KPIs: indicador vivo de cálculo em segundo plano (laranja Rixel) */
.kpis{position:relative}
.kpis.busy::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);background-size:35% 100%;background-repeat:no-repeat;animation:calcRun 1.1s linear infinite;pointer-events:none}
.kpis.busy::after{content:"calculando…";position:absolute;left:50%;top:0;transform:translate(-50%,-100%);padding:3px 10px 2px;border-radius:8px 8px 0 0;background:var(--surface);border:1px solid var(--line);border-bottom:0;font-size:10.5px;font-weight:550;letter-spacing:.01em;color:var(--muted);pointer-events:none;z-index:4}
.kpis.busy .kpi .v{opacity:.62;transition:opacity .2s}
@keyframes calcRun{from{background-position:-40% 0}to{background-position:140% 0}}
.btn.icon{padding:7px 10px}.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.icon .tl{font-size:12.5px}
.i-sun{display:none}:root[data-theme="dark"] .i-sun{display:block}:root[data-theme="dark"] .i-moon{display:none}
/* trilho de etapas (como o menu lateral do backoffice: fundo suave no ativo, ícone e filete laranja) */
.rail{grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rail button{position:relative;display:grid;justify-items:center;gap:5px;padding:10px 2px 9px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:10.5px;font-weight:550;letter-spacing:0;transition:background .15s var(--ease),color .15s var(--ease)}
.rail button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--ink);background:var(--soft)}
.rail button[aria-current="page"]{color:var(--ink);background:var(--soft);font-weight:650}
.rail button[aria-current="page"] svg{stroke:var(--brand)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.rail .st{position:absolute;top:8px;right:14px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.rail button[aria-current="page"] .st,.rail button:hover .st{box-shadow:0 0 0 2px var(--soft)}
.st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}
.panel{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--line)}
.phead{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.phead .eb{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.phead h1{font-weight:600;font-size:21px;letter-spacing:-.025em;margin:3px 0 4px}
.phead p{margin:0;color:var(--muted);font-size:13px}
.phead .sub{margin-top:12px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pbody>*{flex:none}
.pfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface)}
.stage{grid-row:2;grid-column:3;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.view{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,var(--stage-a),var(--stage-b))}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
#c3d,#c2d{position:absolute;inset:0}

/* ===== componentes ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card);overflow:hidden}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px 10px}
.card>.ch h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.card>.ch .aside{font-size:12px;color:var(--muted)}
.card>.cb{padding:2px 16px 16px;display:grid;gap:12px}
.card.flat{background:var(--surface-2);border-color:transparent;box-shadow:none}
.card.hero{background:linear-gradient(160deg,var(--brand-soft),transparent 55%),var(--surface)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:14px;font-weight:600;letter-spacing:-.01em;transition:background .15s var(--ease)}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s var(--ease);margin-right:4px;flex:none}
details.card[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details.card>.cb{padding-top:0}
.grp{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px;display:flex;gap:10px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.kv.three{grid-template-columns:1fr 1fr 1fr}
.fld{display:grid;gap:5px;min-width:0;align-content:start}
.fld.wide{grid-column:1/-1}
.fl{font-size:12px;font-weight:500;color:var(--ink-2);display:flex;gap:5px;align-items:center;min-width:0}
.fl .hlp{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:9.5px;font-style:normal;font-weight:600;cursor:help;flex:none}
.inp{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;min-width:0;box-shadow:var(--shadow-s);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.inp:hover{border-color:var(--line-2)}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:7px 10px;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;outline:none}
.inp input.t{font-weight:400}
.inp em{font-style:normal;font-size:11.5px;color:var(--muted);padding-right:10px;white-space:nowrap}
.fsub{font-size:11px;color:var(--muted)}
.fsub:empty{display:none}
select.sel,.txt,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none;box-shadow:var(--shadow-s);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
select.sel:hover,.txt:hover,textarea:hover{border-color:var(--line-2)}
select.sel:focus,.txt:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
select.sel{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
textarea{min-height:76px;font-family:var(--f-code);font-size:12px;resize:vertical}
.stp{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-s)}
.stp button{border:0;background:none;height:32px;font-size:16px;color:var(--ink-2);transition:background .15s var(--ease)}
.stp button:hover{background:var(--soft)}
.stp input{border:0;background:transparent;text-align:center;font-size:13.5px;font-weight:550;width:100%;min-width:0;outline:none;padding:6px 0}
.stp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sl{display:grid;gap:3px}
.sl .slh{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;color:var(--ink-2)}
.sl .slh output{color:var(--ink);font-size:12.5px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:22px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--sel),var(--sel)) 0/var(--fill,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--sel)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(16,16,20,.12);margin-top:-7px;box-shadow:0 1px 3px rgba(16,16,20,.22),0 0 0 0 var(--brand-soft);transition:transform .12s var(--ease),box-shadow .15s var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid rgba(16,16,20,.12);box-shadow:0 1px 3px rgba(16,16,20,.22)}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 1px 3px rgba(16,16,20,.22),0 0 0 5px var(--sel-soft)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.1)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;user-select:none;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tg{width:34px;height:20px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-2);position:relative;flex:none;transition:background .18s var(--ease),border-color .18s var(--ease)}
.sw .tg::after{content:"";position:absolute;left:1px;top:1px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--ease),background .18s var(--ease)}
.sw input:checked+.tg{background:var(--sel);border-color:var(--sel)}
.sw input:checked+.tg::after{transform:translateX(14px);background:var(--sel-ink)}
.sw input:focus-visible+.tg{outline:2px solid var(--brand);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 13px;min-height:34px;font-weight:550;font-size:13px;line-height:1.1;white-space:nowrap;box-shadow:var(--shadow-s);transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .1s var(--ease)}
.btn:hover{background:var(--soft);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(232,112,42,.3)}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:8px;padding:5px 11px;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:var(--shadow-s),0 0 0 1px var(--glass-line)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg select{border:0;background:transparent;padding:4px 6px;font-size:12.5px;max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:550;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--line-2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.chip[aria-pressed="true"]::before{background:var(--sel-ink);border-color:var(--sel-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:11px;font-weight:600;line-height:1;padding:4px 9px;background:var(--neutral-soft);color:var(--ink-2);border:0;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{color:var(--muted);font-size:12px;margin:0;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;font-weight:600;color:var(--muted)}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-size:12.5px;font-weight:500;white-space:nowrap;padding-left:8px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tot td{font-weight:650;border-top:1px solid var(--line-2)}
.tbl tr.neg td:last-child{color:var(--bad)}
.tbl tr.pos td:last-child{color:var(--ok)}
.tbl.multi td:not(:first-child),.tbl.multi th:not(:first-child){text-align:right;font-size:12px;padding-left:10px;white-space:nowrap}
.tbl.multi th{font-size:11.5px;font-weight:600;white-space:normal;min-width:90px;max-width:150px}
.tbl .best{color:var(--ok);font-weight:650}
.scroll{overflow-x:auto}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);padding:11px 13px;min-width:0}
.met .l{font-size:11.5px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.met .v{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met .s{font-size:11px;color:var(--muted)}
.met.big{grid-column:1/-1}.met.big .v{font-size:28px;letter-spacing:-.03em}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink-2)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.ok i{background:var(--ok)}
.use{display:grid;gap:9px}
.use .ur{display:grid;grid-template-columns:104px 1fr 64px;gap:10px;align-items:center;font-size:12px}
.use .ur span:last-child{text-align:right;font-weight:550}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%}
.stackleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.stackleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sens{display:grid;grid-template-columns:70px repeat(3,1fr);gap:3px;font-size:12px;text-align:center}
.sens div{padding:6px 2px;border-radius:7px}
.sens .h{color:var(--muted);font-size:11px;background:none}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s var(--ease),background .15s var(--ease)}
.li.on{border-color:var(--line-2);background:var(--surface);box-shadow:var(--shadow-s),inset 3px 0 0 var(--brand)}
.li.clk{cursor:pointer}.li.clk:hover{border-color:var(--line-2)}
.li .tt{font-weight:550;font-size:13px}
.li .ss{font-size:11.5px;color:var(--muted)}
.tw{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.tw .twh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw .twh b{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.mixr,.mixh{display:grid;grid-template-columns:1.5fr .9fr 1.05fr .85fr 1.15fr 20px;gap:6px;align-items:center}
.mixh{font-size:11px;color:var(--muted)}
.mixr .inp input{padding:6px 6px;font-size:12.5px}
.mixr .stp{grid-template-columns:22px 1fr 22px}.mixr .stp button{height:30px;font-size:14px}
.mixc{display:grid;gap:6px;padding:10px;border-radius:var(--r);background:var(--surface-2)}
.mixc .r1{display:grid;grid-template-columns:10px 1fr 100px 18px;gap:7px;align-items:center}
.mixc .r2{display:grid;grid-template-columns:.9fr 1.25fr 1fr;gap:6px}
.mixc .inp,.mixc .stp{background:var(--field)}
.mixc .inp input{padding:6px 7px;font-size:13px}.mixc .inp em{padding-right:7px;font-size:11px}
.mixc .stp{grid-template-columns:28px 1fr 28px}.mixc .stp button{height:30px}
.lzr{display:grid;grid-template-columns:1fr 92px 18px;grid-template-areas:"n a x" "l t t" "m m m";gap:6px;align-items:center;padding:8px;border-radius:var(--r);background:var(--surface-2);border:1px solid transparent}
.lzr.miss{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.lzr .inp,.lzr .sel{background-color:var(--field)}.lzr .inp input{padding:6px 7px;font-size:13px}.lzr .inp em{padding-right:7px;font-size:11px}.lzr .sel{padding:6px 28px 6px 8px;font-size:12.5px;background-position:right 7px center}
.lzr>:nth-child(1){grid-area:n}.lzr>:nth-child(2){grid-area:a}.lzr>:nth-child(3){grid-area:l}.lzr>:nth-child(4){grid-area:t;justify-self:stretch;text-align:center;padding:6px 8px}.lzr>:nth-child(5){grid-area:x}
.lzr .lzm{grid-area:m;font-size:11.5px;color:var(--bad)}
.chip[hidden]{display:none}
.sw8{width:10px;height:10px;border-radius:3px;border:1px solid var(--line-2)}
.x{border:0;background:none;color:var(--faint);font-size:17px;line-height:1;padding:4px 0;transition:color .15s var(--ease)}
.x:hover{color:var(--bad)}
.edge{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.edge.front{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-s),inset 3px 0 0 var(--brand)}
.edge b{font-size:12px;color:var(--muted);font-weight:600}
.edge .inp{max-width:130px}
.edge .ops{display:flex;gap:4px}
.edge .recs{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tag{font-size:11px;font-weight:550;padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease)}
.tag:hover{border-color:var(--line-2)}
.tag[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tag.alt[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.tag.vei[aria-pressed="true"]{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--bad)}
.compass{display:grid;place-items:center}
.compass svg{width:100%;max-width:178px;height:auto;aspect-ratio:1}
.compass .cd{cursor:pointer}
.compass .cd text{font-size:10px;font-weight:600;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.compass .cd circle{fill:var(--surface-2);stroke:var(--line-2)}
.compass .cd.on circle{fill:var(--sel);stroke:var(--sel)}
.compass .cd.on text{fill:var(--sel-ink)}
.compass .cd:hover circle{stroke:var(--ink-2)}
.prog{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s var(--ease)}
.res{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:grid;gap:7px;background:var(--surface)}
.res.top1{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));box-shadow:0 0 0 3px var(--brand-soft)}
.res .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .rh b{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.res .rm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--muted)}
.res .rm span b{display:block;font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.ai-out{font-size:12.5px;white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:9px}

/* ===== palco ===== */
.viewbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;pointer-events:none;align-items:flex-start}
.viewbar>*{pointer-events:auto}
.viewbar .seg,.viewbar>.btn,.legend,.hint,.sunbox,.cfdbar,.cfdlegend,.cfdprobe,.planleg,.calib{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.viewbar .seg{border-radius:12px;padding:3px}
.viewbar .seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:none}
.viewbar .grow{flex:1}
.legend,.planleg{position:absolute;right:12px;bottom:12px;z-index:3;border-radius:var(--r);padding:10px 12px;font-size:12px;display:grid;gap:5px;max-width:240px;max-height:calc(100% - 90px);overflow:auto}
.legend b,.planleg b,.cfdlegend b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.legend i,.planleg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px;border:1px solid var(--glass-line)}
.hint{pointer-events:none;position:absolute;left:12px;bottom:12px;max-width:min(62%,460px);border-radius:var(--r);padding:8px 12px;font-size:12.5px;z-index:3}
.hint::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);margin-right:9px;vertical-align:1px}
.sunbox{position:absolute;right:12px;top:60px;z-index:4;border-radius:var(--r);padding:11px 13px;width:240px;font-size:12.5px;display:grid;gap:6px}
.sunbox .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calib{position:absolute;top:104px;left:12px;z-index:4;border-radius:var(--r);padding:8px 10px;display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.calib input{width:80px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--field)}
.cfdbar{position:absolute;left:12px;bottom:12px;z-index:4;border-radius:14px;padding:8px 10px;max-width:min(640px,calc(100% - 270px));display:grid;gap:6px}
.cfdbar .chips .chip{padding:4px 10px}
.cfdbar select{border:1px solid var(--line);border-radius:8px;background:var(--field);padding:4px 6px;font-size:12.5px}
.cfstat{font-size:11px;color:var(--muted)}
.cfdlegend{position:absolute;right:12px;top:60px;z-index:4;border-radius:var(--r);padding:10px 12px;width:230px;font-size:12px;display:grid;gap:5px}
.cfdlegend .cbar{height:8px;border-radius:4px}
.cfdlegend .cl{display:flex;justify-content:space-between;font-size:11px}
.cfdlegend .lnote{color:var(--muted);font-size:11px}
.cfdlegend .lw{display:flex;align-items:center;gap:6px}.cfdlegend .lw i{width:12px;height:10px;border-radius:3px;display:inline-block}
.cfdprobe{position:absolute;right:12px;bottom:12px;z-index:5;width:280px;font-size:12.5px;border-radius:14px;padding:11px 13px}
.cfdprobe .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cfdprobe .tbl td{padding:3px 0}
.cfchips{display:flex;gap:4px;flex-wrap:wrap}

/* régua de indicadores (como os cartões de estatística do backoffice: rótulo discreto, número grande) */
.kpis{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line)}
.kpi{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:11.5px;font-weight:500;letter-spacing:0;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.kpi .v{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:40;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;max-width:90vw;box-shadow:var(--shadow-pop)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== apresentação (tela cheia, só leitura) ===== */
.ap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 30% 0%,var(--stage-a),var(--stage-b));color:var(--ink);--ap-acc:var(--brand)}
.ap-top{display:flex;align-items:center;gap:16px;padding:14px 24px;flex:none;z-index:3}
.ap-brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 0;font-weight:650;font-size:20px;letter-spacing:-.06em;white-space:nowrap}
.ap-brand svg{width:24px;height:24px;flex:none}.ap-brand img{height:28px;max-width:130px;object-fit:contain;border-radius:3px}.ap-brand .n{overflow:hidden;text-overflow:ellipsis}
.ap-brand .n i{font-style:normal;color:var(--brand);margin-left:-1px}
:root[data-theme="dark"] .ap-brand img{background:#fff;padding:3px 7px;border-radius:7px}
.ap-prog{display:flex;justify-content:center;gap:4px;flex:none}
.ap-prog button{position:relative;width:46px;height:22px;border:0;background:none;padding:0}
.ap-prog button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:var(--line-2);transition:background .3s var(--ease)}
.ap-prog button.vis::after{background:color-mix(in srgb,var(--ap-acc) 40%,var(--line-2))}
.ap-prog button[aria-current="step"]::after{background:var(--ap-acc)}
.ap-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex:1 1 0}
.ap-main{position:relative;flex:1;min-height:0}
.ap-3d{position:absolute;inset:0;transition:opacity .35s}
.ap-3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ap[data-slot="off"] .ap-3d{opacity:0;pointer-events:none}
.ap[data-slot="side"] .ap-3d{left:52%;right:24px;top:2px;bottom:6px;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.ap-slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 32px 18px;pointer-events:none;scrollbar-width:thin}
.ap-slide>*{pointer-events:auto}
.aps{max-width:1240px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;animation:apIn .45s var(--ease)}
@keyframes apIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aps .eb{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.aps .eb::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--ap-acc)}
.aps h1,.aps h2{font-weight:600;letter-spacing:-.035em;line-height:1.08;margin:8px 0 6px}
.aps h1{font-size:clamp(28px,3.6vw,50px)}.aps h2{font-size:clamp(22px,2.5vw,34px)}
.aps .lead{color:var(--ink-2);font-size:clamp(13.5px,1.25vw,16px);margin:0 0 14px;max-width:62ch}
.aps-hero{justify-content:flex-end;min-height:100%;padding-bottom:6px}
.aps-cap{max-width:560px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--glass-line);border-radius:var(--r-xl);padding:22px 26px;box-shadow:var(--shadow)}
.aps-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aps-chips span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.aps-chips b{font-weight:650;color:var(--ink)}
.aps-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
.aps-plan{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-card);background:var(--surface-2);aspect-ratio:1.18}
.aps-plan canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.ap-slide.noanim .aps{animation:none}.ap-slide{touch-action:pan-y}
.aps-num{align-items:center}
.aps-prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.aps-col{display:grid;gap:14px;align-content:center;min-width:0}
.aps-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.aps-tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.aps-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;min-width:0;box-shadow:var(--shadow-card)}
.aps-tile.hl{background:linear-gradient(160deg,var(--brand-soft),transparent 60%),var(--surface)}
.aps-tile .l{font-size:12.5px;font-weight:500;color:var(--muted)}
.aps-tile .v{font-size:clamp(20px,2.4vw,34px);font-weight:600;letter-spacing:-.03em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aps-tile .s{font-size:12px;color:var(--muted);margin-top:1px}
.aps-tile .v.ok{color:var(--ok)}.aps-tile .v.warn{color:var(--warn)}.aps-tile .v.bad{color:var(--bad)}
.aps-card{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;min-width:0;box-shadow:var(--shadow-card)}
.aps-card h3{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.aps-use{display:grid;gap:10px}.aps-use .ur{display:grid;grid-template-columns:110px 1fr 54px;gap:12px;align-items:center;font-size:13px}.aps-use .ur span:last-child{text-align:right;font-weight:550}
.aps-tw{overflow:auto;max-height:min(52vh,520px);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-card)}
.aps-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.aps-tbl th{position:sticky;top:0;background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.aps-tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.aps-tbl tr:last-child td{border-bottom:0}
.aps-tbl .n{text-align:right;font-weight:500}
.aps-tbl tr.tot td{font-weight:650;background:var(--surface-2)}
.aps-sol{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--brand)}
.aps-sum{display:flex;flex-wrap:wrap;gap:8px 28px;margin:2px 0 14px}.aps-sum div{display:grid}.aps-sum .l{font-size:12px;color:var(--muted);font-weight:500}.aps-sum .v{font-size:clamp(18px,2vw,26px);font-weight:600;letter-spacing:-.025em}
.aps-foot{font-size:11.5px;color:var(--muted);margin-top:12px;max-width:80ch}
.aps-pills{display:flex;flex-wrap:wrap;gap:6px}
.ap-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px calc(16px + env(safe-area-inset-bottom,0px));flex:none;z-index:3}
.ap-step{font-size:12.5px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-step b{color:var(--ink);font-weight:600}
.ap-msg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;z-index:4;background:var(--bg)}
.ap-msg h2{font-size:22px;font-weight:600;letter-spacing:-.025em;margin:0}.ap-msg p{color:var(--muted);margin:0;max-width:44ch}
.ap-ro .app{visibility:hidden}
#toast{z-index:80}
/* ===== marca no PDF ===== */
.mk-prev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mk-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--mk);color:var(--mkt);font-size:11.5px;min-height:34px}
.mk-bar img{height:18px;max-width:70px;object-fit:contain}.mk-bar img.op{background:#fff;border-radius:3px;padding:1px}
.mk-bar b{letter-spacing:-.02em;font-size:12.5px;font-weight:650}.mk-bar span{margin-left:auto;opacity:.85}
.mk-cap{padding:10px 12px;display:grid;gap:2px}.mk-cap i{width:22px;height:3px;background:var(--mk);border-radius:2px;margin-bottom:4px}.mk-cap b{font-size:14px;font-weight:600;letter-spacing:-.015em}.mk-cap span{color:var(--muted);font-size:11.5px}
.mk-rod{border-top:2px solid var(--mk);margin:0 12px 8px;padding-top:4px;font-size:10.5px;color:var(--muted)}
.mk-cores{display:flex;gap:8px;flex-wrap:wrap}
.mk-sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);background:var(--c);padding:0;position:relative;display:inline-block}
.mk-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.mk-pick{background:conic-gradient(#d44,#dc4,#4c6,#4cd,#46d,#c4c,#d44);overflow:hidden;cursor:pointer}.mk-pick input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
@media (max-width:900px){
  #apTop .lb,#apAbrir .lb,#apTela{display:none}
  .ap-brand{flex:none}.ap-brand img{height:24px;max-width:84px}.ap-prog{flex:1}.ap-acts{flex:none}
  .ap-prog button{width:24px}.aps-tbl th,.aps-tbl td{padding:7px 8px}
  .ap-top{padding:10px 14px;gap:8px}.ap-brand .n{display:none}
  .ap-slide{padding:2px 16px 14px}
  .aps-split,.aps-prod{grid-template-columns:minmax(0,1fr);gap:16px}
  .aps-split{align-items:start}.aps-plan{aspect-ratio:1.25}
  .aps-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aps-use .ur{grid-template-columns:86px 1fr 48px}
  .ap{--h3d:30vh}
  .ap[data-slot="side"] .ap-3d{left:16px;right:16px;top:0;bottom:auto;height:var(--h3d)}
  .ap[data-slot="side"] .ap-slide{padding-top:calc(var(--h3d) + 12px)}
  .aps-cap{padding:16px 18px;max-width:none;width:100%}
  .aps-tw{max-height:46vh}
  .ap-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
}

/* ===== celular ===== */
@media (max-width:900px){
  body{font-size:14px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;height:auto;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .top{height:56px;padding:0 10px 0 14px;gap:10px}
  .brand .wm,.brand .by,.top .sep{display:none}
  .top .proj{gap:2px}
  .top .proj input{min-width:96px;padding:6px 4px}
  .top .hist .btn.icon{padding:6px 5px}
  .top .acts{gap:4px}
  .top .acts .btn.icon .tl{display:none}
  .top .acts .btn{padding:7px 9px}
  .stage{grid-row:2;grid-column:1}
  .view{height:56vh;min-height:330px}
  .panel{grid-row:3;grid-column:1;border-right:0}
  .pbody{overflow:visible}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);overflow-x:auto;gap:0;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
  .rail button{padding:6px 4px;font-size:10px;min-width:50px}
  .rail button[aria-current="page"]{background:none}
  .rail button[aria-current="page"]::before{left:16px;right:16px;top:-6px;bottom:auto;width:auto;height:2px;border-radius:0 0 3px 3px}
  .rail .st{right:10px;top:4px;box-shadow:none!important}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi{padding:8px 10px;border-bottom:1px solid var(--line)}
  .kpi .v{font-size:15px}
  .kpi .s{font-size:10.5px}
  .viewbar{top:8px;left:8px;right:8px;gap:6px}
  .legend{display:none}
  .planleg{max-width:200px;font-size:11px}
  .sunbox{top:auto;bottom:8px;right:8px;left:8px;width:auto}
  .cfdlegend{top:auto;bottom:8px;right:8px;width:160px}
  .cfdbar{bottom:auto;top:52px;left:8px;max-width:calc(100% - 16px)}
  .cfchips{display:none}
  .cfdprobe{left:8px;right:8px;width:auto;bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

/* ===== UX v2: seções com resumo, ajuda ⓘ, mais opções, sub-abas (ver docs/UX.md) ===== */
.app{grid-template-columns:76px clamp(360px,28vw,440px) minmax(0,1fr)}
.kv{grid-template-columns:repeat(auto-fill,minmax(min(100%,138px),1fr))}
.kv.three{grid-template-columns:repeat(auto-fill,minmax(min(100%,100px),1fr))}
.fl{align-items:flex-start;line-height:1.3}
.fl .info{margin-top:-1px}
/* seção padrão: sempre recolhível, com resumo do que está dentro */
details.card>summary{justify-content:flex-start;gap:8px;min-height:46px}
details.card>summary>.st{flex:none;max-width:62%}
details.card>summary>.sum{flex:1;min-width:0;text-align:right;font-weight:400;font-size:12px;letter-spacing:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.card>summary>.sum b{color:var(--ink-2);font-weight:600}
details.card>summary .info{flex:none}
details.card[open]>summary>.sum{visibility:hidden}
details.card>summary:hover{background:var(--surface-2)}
details.card:not([open]){box-shadow:var(--shadow-s)}
/* resultado (RES): título-sobrancelha com ponto vivo laranja */
.card.res>.ch h2{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card.res>.ch h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);flex:none}
/* ajuda */
.info{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font:600 10px/1 var(--f-sans);padding:0;cursor:pointer;flex:none;transition:color .15s var(--ease),border-color .15s var(--ease),background .15s var(--ease)}
.info:hover,.info[aria-expanded="true"]{color:var(--sel-ink);border-color:var(--sel);background:var(--sel)}
.termo{text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:3px;cursor:help;border:0;background:none;padding:0;font:inherit;color:inherit}
.termo:hover{color:var(--ink);text-decoration-color:currentColor}
.pop{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:14px 16px;font-size:13px;line-height:1.55;color:var(--ink-2)}
.pop[hidden]{display:none}
.pop h4{margin:0 0 4px;font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.pop .f{margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--surface-2);font-size:12px;font-weight:500;color:var(--ink)}
.pop .ex{margin-top:6px;font-size:12px;color:var(--muted)}
.pop .x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;cursor:pointer}
/* mais opções */
.adv{display:grid;gap:10px}
.advbtn{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 0 2px;color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;justify-self:start;transition:color .15s var(--ease)}
.advbtn:hover{color:var(--ink)}
.advbtn::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}
.advbtn[aria-expanded="true"]::after{transform:rotate(-135deg) translateY(-1px)}
.advb{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.advb[hidden]{display:none}
/* sub-abas de uma etapa */
.subtabs{margin-top:2px}
/* glossário */
.gloss{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,10,12,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:16px}
.gloss[hidden]{display:none}
.gloss .gb{width:min(620px,100%);max-height:min(80vh,720px);display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-pop);overflow:hidden}
.gloss .gh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.gloss .gh h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.gloss .gs{padding:0 18px 10px}
.gloss .gl{overflow:auto;padding:0 18px 18px;display:grid;gap:2px}
.gloss .gi{padding:10px 11px;border-radius:10px}
.gloss .gi:hover{background:var(--surface-2)}
.gloss .gi b{font-weight:600;color:var(--ink)}
.gloss .gi p{margin:2px 0 0;color:var(--ink-2);font-size:13px;line-height:1.5}
.note.short{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.pop{left:12px!important;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));top:auto!important;max-width:none}}

/* ===== UX global v2: topo, inspetor, palco, régua e celular ===== */
.btn .ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#themeBtn .tl{display:none}
#pdfTop .ico{width:15px;height:15px}
/* resultado (RES) não herda o espaçamento das linhas de lista .res */
.card.res{padding:0;display:block;gap:0;border-radius:var(--r)}
/* cabeçalho, corpo e rodapé do inspetor */
.phead{padding:16px 18px 14px}
.phead h1{font-size:20px;margin:3px 0 2px;line-height:1.2}
.phead p{line-height:1.45}
.phead .sub{margin-top:12px}
.pbody{padding:12px 12px 24px;gap:10px}
.pfoot{padding:9px 12px}
.note:empty{display:none}
/* palco: barra da vista (uma linha) + painel de ferramentas à esquerda + legenda recolhida */
.viewbar{gap:6px;align-items:center}
.viewbar .seg button{padding:5px 8px}
.viewbar .vbreak{display:none}
.vacts{display:flex;gap:6px;align-items:center}
.vacts .btn,.vtools .seg{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.vacts .btn{height:36px;padding:0 11px;border-radius:12px}
.vacts .btn:hover{background:var(--surface)}
.vacts .btn[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.vacts .btn.on{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.vtools{position:absolute;left:12px;top:calc(var(--vbh,52px) + 8px);z-index:3;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - var(--vbh,52px) - 64px);overflow:auto;scrollbar-width:none}
.vtools:not(:has(>:not([hidden]))){display:none}
.vtools .seg{display:flex;flex-direction:column;align-items:stretch;border-radius:12px;padding:3px;flex:none}
.vtools .seg button{text-align:left;padding:7px 12px}
.vtools .seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:none}
.calib{top:calc(var(--vbh,52px) + 8px);left:50%;transform:translateX(-50%)}
.sunbox,.cfdlegend{top:calc(var(--vbh,52px) + 8px)}
.legend,.planleg{max-height:calc(100% - var(--vbh,52px) - 24px)}
.hint{max-width:min(56%,420px)}
/* régua de indicadores */
.kpi{padding:10px 14px}
.kpi .l .termo{letter-spacing:inherit;text-transform:inherit;font-weight:inherit;color:inherit;text-decoration-color:color-mix(in srgb,var(--muted) 55%,transparent)}
.kpi .l .termo:hover{color:var(--ink)}
@media (min-width:901px) and (max-width:1560px){ .kpi{padding:9px 9px} .kpi .l{font-size:10.5px;gap:4px} .kpi .v{font-size:15.5px;letter-spacing:-.03em} .kpi .s{font-size:10px} }
@media (min-width:901px) and (max-width:1340px){ .kpi{padding:8px 7px} .kpi .l{font-size:10px} .kpi .v{font-size:14px} .kpi .s{font-size:9.5px} }
/* listas compactas (estudos, versões, cenários): marcar para comparar · nome e números · ações */
#estBox,#vsBox,#cenBox,#cmpBox{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px 8px 11px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s var(--ease),background .15s var(--ease)}
.lrow.on{border-color:var(--line-2);background:var(--surface);box-shadow:var(--shadow-s),inset 3px 0 0 var(--brand)}
.lrow .lx{min-width:0;display:grid;gap:1px}
.lrow .lt{display:flex;align-items:center;gap:6px;min-width:0}
.lrow .lt b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lrow .lt .pill{flex:none}
.lrow .lm{font-size:11.5px;color:var(--muted);line-height:1.35}
.lrow .la{display:flex;gap:2px;align-items:center}
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--field);padding:0;position:relative;flex:none;cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease)}
.ck::before{content:"";position:absolute;inset:-9px}
