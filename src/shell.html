<title>Gabarito Viabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Direção: estúdio de arquitetura — porcelana fria e grafite, vidro fosco sobre o palco, teal de vidro para ações e amarelo de obra só para marcações de projeto.
   Estrutura: trilho de etapas (o processo) · inspetor da etapa · palco (maquete, plantas, simulações) com régua de indicadores. */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#eceff2; --ink:#14202a; --ink-2:#34434f; --muted:#6a7884; --line:#e0e5ea; --line-2:#cfd6dc;
  --accent:#1c6878; --accent-2:#e3f0f2; --accent-ink:#ffffff; --mark:#d49c17; --ok:#2e8b62; --warn:#c0811a; --bad:#c2493a;
  --glass:rgba(255,255,255,.80); --glass-line:rgba(20,32,42,.08); --shadow:0 12px 32px rgba(20,32,42,.10),0 1px 2px rgba(20,32,42,.06); --shadow-s:0 1px 2px rgba(20,32,42,.08);
  --m-sub:#8d969c; --m-gar:#b6bec4; --m-ter:#8db8cf; --m-tipo:#fbfbf9; --m-lote:#d3e0cc; --m-env:#c2493a; --m-loja:#e2b983; --m-cob:#d7c49a; --m-viz:#c3c9ce;
  --u1:#b5d0e2; --u2:#ecd3ae; --u3:#c4dcbc; --u4:#e2c0ca; --u5:#cec5e6;
  --c-circ:#e7ebee; --c-sac:#b5e0e4; --c-esc:#efe9de; --c-ant:#e2edf1; --c-duto:#f4e6bd; --c-balc:#d9f0eb; --c-elev:#d5dde3; --c-emerg:#f1d8cf; --c-shaft:#dde1e4; --c-hall:#ffffff; --c-tec:#eef0f1; --c-pass:#ffffff; --c-lixo:#e6e1d8; --c-hserv:#f4f6f7; --c-drive:#d5d9dc; --lz-c:#d8e8d0; --lz-agua:#a9d9e6; --lz-deck:#ead9bd;
  --stage-a:#f7f9fa; --stage-b:#e2e8ec;
  --ctx-mar:#bcd6e0; --ctx-agua:#b4d1dd; --ctx-agua-l:#8fb5c4; --ctx-areia:#ece3cd; --ctx-verde:#d3e1c5; --ctx-mata:#bed2ad; --ctx-asf:#c5cbd0; --ctx-asf-l:#adb5bb; --ctx-cal:#e3e6e9; --ctx-ciclo:#d6b1a5; --ctx-estac:#d6dade; --ctx-praca:#e8e4db; --ctx-casa:#ebe3d6; --ctx-telha:#b7836c; --ctx-res:#d3d8dc; --ctx-com:#c8d1d9; --ctx-out:#d4d2cb; --ctx3-asf:#61696f; --ctx3-cal:#bdbfbe; --ctx3-agua:#4d8aa1; --ctx3-mar:#3d7a93; --ctx3-areia:#e2d5b6; --ctx3-verde:#9db786; --ctx3-mata:#7c9a68; --ctx3-estac:#7b8287; --ctx3-praca:#cbc6ba;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1115; --surface:#121a1f; --surface-2:#182229; --surface-3:#1d2830; --ink:#e7edf0; --ink-2:#c3ced5; --muted:#8c9aa4; --line:#232f37; --line-2:#2e3c46;
  --accent:#5fb7c4; --accent-2:#173238; --accent-ink:#071419; --mark:#e6b544; --ok:#5cc391; --warn:#e5a94f; --bad:#ef7d66;
  --glass:rgba(18,26,31,.80); --glass-line:rgba(231,237,240,.08); --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --m-sub:#4d575d; --m-gar:#5f6a71; --m-ter:#3d7590; --m-tipo:#dfe3e2; --m-lote:#2f4232; --m-env:#ef7d66; --m-loja:#b98a4d; --m-cob:#a5935f; --m-viz:#4d565c;
  --u1:#3c6680; --u2:#87683d; --u3:#4d6f47; --u4:#7f4f5c; --u5:#5c5385;
  --c-circ:#26323a; --c-sac:#2f7c84; --c-esc:#3a3830; --c-ant:#2a3a42; --c-duto:#5a4d22; --c-balc:#28463f; --c-elev:#33414b; --c-emerg:#4d3029; --c-shaft:#30393f; --c-hall:#121a1f; --c-tec:#1c252b; --c-pass:#121a1f; --c-lixo:#2f2c27; --c-hserv:#18232a; --c-drive:#2a333a; --lz-c:#2f4a37; --lz-agua:#2b6878; --lz-deck:#5e4f37;
  --ctx-mar:#17323d; --ctx-agua:#1a3744; --ctx-agua-l:#2a5466; --ctx-areia:#3b382f; --ctx-verde:#21352a; --ctx-mata:#1c3024; --ctx-asf:#2e383f; --ctx-asf-l:#3a464e; --ctx-cal:#3c474e; --ctx-ciclo:#593c37; --ctx-estac:#29333a; --ctx-praca:#343b3e; --ctx-casa:#6b645b; --ctx-telha:#7e5545; --ctx-res:#59626a; --ctx-com:#525e69; --ctx-out:#5c5d59; --ctx3-asf:#353c41; --ctx3-cal:#5f6466; --ctx3-agua:#2a5d71; --ctx3-mar:#234f63; --ctx3-areia:#6f6853; --ctx3-verde:#4a6743; --ctx3-mata:#3b5737; --ctx3-estac:#40474c; --ctx3-praca:#5a5a55;
  --stage-a:#172128; --stage-b:#0b1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1115; --surface:#121a1f; --surface-2:#182229; --surface-3:#1d2830; --ink:#e7edf0; --ink-2:#c3ced5; --muted:#8c9aa4; --line:#232f37; --line-2:#2e3c46;
  --accent:#5fb7c4; --accent-2:#173238; --accent-ink:#071419; --mark:#e6b544; --ok:#5cc391; --warn:#e5a94f; --bad:#ef7d66;
  --glass:rgba(18,26,31,.80); --glass-line:rgba(231,237,240,.08); --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --m-sub:#4d575d; --m-gar:#5f6a71; --m-ter:#3d7590; --m-tipo:#dfe3e2; --m-lote:#2f4232; --m-env:#ef7d66; --m-loja:#b98a4d; --m-cob:#a5935f; --m-viz:#4d565c;
  --u1:#3c6680; --u2:#87683d; --u3:#4d6f47; --u4:#7f4f5c; --u5:#5c5385;
  --c-circ:#26323a; --c-sac:#2f7c84; --c-esc:#3a3830; --c-ant:#2a3a42; --c-duto:#5a4d22; --c-balc:#28463f; --c-elev:#33414b; --c-emerg:#4d3029; --c-shaft:#30393f; --c-hall:#121a1f; --c-tec:#1c252b; --c-pass:#121a1f; --c-lixo:#2f2c27; --c-hserv:#18232a; --c-drive:#2a333a; --lz-c:#2f4a37; --lz-agua:#2b6878; --lz-deck:#5e4f37;
  --ctx-mar:#17323d; --ctx-agua:#1a3744; --ctx-agua-l:#2a5466; --ctx-areia:#3b382f; --ctx-verde:#21352a; --ctx-mata:#1c3024; --ctx-asf:#2e383f; --ctx-asf-l:#3a464e; --ctx-cal:#3c474e; --ctx-ciclo:#593c37; --ctx-estac:#29333a; --ctx-praca:#343b3e; --ctx-casa:#6b645b; --ctx-telha:#7e5545; --ctx-res:#59626a; --ctx-com:#525e69; --ctx-out:#5c5d59; --ctx3-asf:#353c41; --ctx3-cal:#5f6466; --ctx3-agua:#2a5d71; --ctx3-mar:#234f63; --ctx3-areia:#6f6853; --ctx3-verde:#4a6743; --ctx3-mata:#3b5737; --ctx3-estac:#40474c; --ctx3-praca:#5a5a55;
  --stage-a:#172128; --stage-b:#0b1115; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== estrutura ===== */
.app{display:grid;grid-template-columns:78px 384px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.app>*{min-width:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px 0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.top .sep{width:1px;height:22px;background:var(--line)}
.top .proj{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .proj input{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:500;min-width:0;width:min(320px,100%);text-overflow:ellipsis;transition:background .15s,border-color .15s}
.top .proj input:hover{background:var(--surface-2)}
.top .proj input:focus{background:var(--surface-2);border-color:var(--accent);outline:none}
.top .acts{display:flex;gap:8px;align-items:center}
.top .hist{display:flex;gap:2px;flex:none}
.top .hist .btn.icon{padding:6px 7px;color:var(--ink-2)}
.top .hist .btn.icon svg{width:17px;height:17px}
.top .hist .btn:disabled{opacity:.3}
.top .hist .btn:not(:disabled):hover{color:var(--ink)}
/* régua de KPIs: indicador discreto de cálculo em segundo plano */
.kpis{position:relative}
.kpis.busy::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:35% 100%;background-repeat:no-repeat;animation:calcRun 1.1s linear infinite;pointer-events:none}
.kpis.busy::after{content:"calculando…";position:absolute;left:50%;top:0;transform:translate(-50%,-100%);padding:3px 10px 2px;border-radius:8px 8px 0 0;background:var(--surface);border:1px solid var(--line);border-bottom:0;font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;color:var(--muted);pointer-events:none;z-index:4}
.kpis.busy .kpi .v{opacity:.62;transition:opacity .2s}
@keyframes calcRun{from{background-position:-40% 0}to{background-position:140% 0}}
.btn.icon{padding:7px 10px}.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.icon .tl{font-size:12px}
.i-sun{display:none}:root[data-theme="dark"] .i-sun{display:block}:root[data-theme="dark"] .i-moon{display:none}
.rail{grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rail button{position:relative;display:grid;justify-items:center;gap:5px;padding:10px 2px 9px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.01em;transition:background .15s,color .15s}
.rail button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--ink);background:var(--surface-2)}
.rail button[aria-current="page"]{color:var(--ink);background:var(--accent-2)}
.rail button[aria-current="page"] svg{stroke:var(--accent)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail .st{position:absolute;top:8px;right:14px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}
.panel{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.phead{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.phead .eb{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phead h1{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:650;font-size:21px;letter-spacing:-.005em;margin:3px 0 4px}
.phead p{margin:0;color:var(--muted);font-size:12.5px}
.phead .sub{margin-top:12px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
.pbody>*{flex:none}
.pfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface)}
.stage{grid-row:2;grid-column:3;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.view{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,var(--stage-a),var(--stage-b))}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
#c3d,#c2d{position:absolute;inset:0}

/* ===== componentes ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px 9px}
.card>.ch h2{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:13.5px;font-weight:620;letter-spacing:.005em}
.card>.ch .aside{font-size:11.5px;color:var(--muted)}
.card>.cb{padding:2px 14px 14px;display:grid;gap:10px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.hero{background:linear-gradient(160deg,var(--accent-2),var(--surface) 70%);border-color:var(--line)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:13.5px;font-weight:620}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .18s;margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>.cb{padding-top:0}
.grp{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 -2px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kv.three{grid-template-columns:1fr 1fr 1fr}
.fld{display:grid;gap:4px;min-width:0;align-content:start}
.fld.wide{grid-column:1/-1}
.fl{font-size:11.5px;color:var(--ink-2);display:flex;gap:5px;align-items:center;min-width:0}
.fl .hlp{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--surface-3);color:var(--muted);font-size:9.5px;font-style:normal;font-weight:600;cursor:help;flex:none}
.inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;min-width:0;transition:border-color .15s,background .15s}
.inp:hover{border-color:var(--line-2)}
.inp:focus-within{border-color:var(--accent);background:var(--surface)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:7px 9px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;outline:none}
.inp input.t{font-family:var(--f-body)}
.inp em{font-style:normal;font-size:11px;color:var(--muted);padding-right:9px;white-space:nowrap}
.fsub{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.fsub:empty{display:none}
select.sel,.txt,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
select.sel:focus,.txt:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:76px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.stp{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{border:0;background:none;height:32px;font-size:16px;color:var(--ink-2)}
.stp button:hover{background:var(--surface-3)}
.stp input{border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:13px;width:100%;min-width:0;outline:none;padding:6px 0}
.sl{display:grid;gap:3px}
.sl .slh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2)}
.sl .slh output{font-family:var(--f-mono);color:var(--ink);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:22px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent)) 0/var(--fill,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.sw{display:flex;align-items:center;gap:10px;font-size:12.5px;cursor:pointer;user-select:none;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tg{width:32px;height:18px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw .tg::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.tg{background:var(--accent)}
.sw input:checked+.tg::after{transform:translateX(14px)}
.sw input:focus-visible+.tg{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--mark);border-color:var(--mark);color:#1c1606}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s),0 0 0 1px var(--line)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg select{border:0;background:transparent;padding:4px 6px;font-size:12.5px;max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{background:var(--accent-ink);border-color:var(--accent-ink)}
.pill{display:inline-block;border-radius:20px;font-size:10.5px;font-family:var(--f-mono);padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.note{color:var(--muted);font-size:11.5px;margin:0;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:5px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap;padding-left:8px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
.tbl tr.neg td:last-child{color:var(--bad)}
.tbl tr.pos td:last-child{color:var(--ok)}
.tbl.multi td:not(:first-child),.tbl.multi th:not(:first-child){text-align:right;font-family:var(--f-mono);font-size:11.5px;padding-left:10px;white-space:nowrap}
.tbl.multi th{font-family:var(--f-body);font-size:11.5px;font-weight:600;white-space:normal;min-width:90px;max-width:150px}
.tbl .best{color:var(--ok);font-weight:600}
.scroll{overflow-x:auto}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.met .l{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.met .v{font-family:var(--f-display);font-variation-settings:"wdth" 100;font-size:19px;font-weight:620;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met .s{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.met.big{grid-column:1/-1}.met.big .v{font-size:26px}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.ok i{background:var(--ok)}
.use{display:grid;gap:9px}
.use .ur{display:grid;grid-template-columns:104px 1fr 64px;gap:10px;align-items:center;font-size:11.5px}
.use .ur span:last-child{text-align:right;font-family:var(--f-mono)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden}
.stack span{display:block;height:100%}
.stackleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.stackleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sens{display:grid;grid-template-columns:70px repeat(3,1fr);gap:3px;font-family:var(--f-mono);font-size:11.5px;text-align:center}
.sens div{padding:6px 2px;border-radius:6px}
.sens .h{color:var(--muted);font-size:10.5px;background:none}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s,background .15s}
.li.on{border-color:var(--accent);background:var(--accent-2)}
.li.clk{cursor:pointer}.li.clk:hover{border-color:var(--line-2)}
.li .tt{font-weight:500;font-size:12.5px}
.li .ss{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tw{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.tw .twh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw .twh b{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:620;font-size:13px}
.mixr,.mixh{display:grid;grid-template-columns:1.5fr .9fr 1.05fr .85fr 1.15fr 20px;gap:6px;align-items:center}
.mixh{font-size:10.5px;color:var(--muted)}
.mixr .inp input{padding:6px 6px;font-size:12px}
.mixr .stp{grid-template-columns:22px 1fr 22px}.mixr .stp button{height:30px;font-size:14px}
.mixc{display:grid;gap:6px;padding:9px;border-radius:12px;background:var(--surface-2)}
.mixc .r1{display:grid;grid-template-columns:10px 1fr 100px 18px;gap:7px;align-items:center}
.mixc .r2{display:grid;grid-template-columns:.9fr 1.25fr 1fr;gap:6px}
.mixc .inp,.mixc .stp{background:var(--surface)}
.mixc .inp input{padding:6px 7px;font-size:12.5px}.mixc .inp em{padding-right:7px;font-size:10.5px}
.mixc .stp{grid-template-columns:28px 1fr 28px}.mixc .stp button{height:30px}
.lzr{display:grid;grid-template-columns:1fr 92px 18px;grid-template-areas:"n a x" "l t t" "m m m";gap:6px;align-items:center;padding:7px;border-radius:11px;background:var(--surface-2);border:1px solid transparent}
.lzr.miss{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.lzr .inp,.lzr .sel{background:var(--surface)}.lzr .inp input{padding:6px 7px;font-size:12.5px}.lzr .inp em{padding-right:7px;font-size:10.5px}.lzr .sel{padding:6px 6px;font-size:12px}
.lzr>:nth-child(1){grid-area:n}.lzr>:nth-child(2){grid-area:a}.lzr>:nth-child(3){grid-area:l}.lzr>:nth-child(4){grid-area:t;justify-self:stretch;text-align:center;padding:6px 8px}.lzr>:nth-child(5){grid-area:x}
.lzr .lzm{grid-area:m;font-size:11px;color:var(--bad)}
.chip[hidden]{display:none}
.sw8{width:10px;height:10px;border-radius:3px;border:1px solid var(--line-2)}
.x{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:4px 0}
.x:hover{color:var(--bad)}
.edge{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.edge.front{border-color:color-mix(in srgb,var(--mark) 60%,transparent);box-shadow:inset 3px 0 0 var(--mark)}
.edge b{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.edge .inp{max-width:130px}
.edge .ops{display:flex;gap:4px}
.edge .recs{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tag{font-size:10.5px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.tag[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1c1606}
.tag.alt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.compass{display:grid;place-items:center}
.compass svg{width:100%;max-width:178px;height:auto;aspect-ratio:1}
.compass .cd{cursor:pointer}
.compass .cd text{font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:10px;font-weight:600;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.compass .cd circle{fill:var(--surface-2);stroke:var(--line-2)}
.compass .cd.on circle{fill:var(--accent);stroke:var(--accent)}
.compass .cd.on text{fill:var(--accent-ink)}
.compass .cd:hover circle{stroke:var(--accent)}
.prog{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px;background:var(--surface)}
.res.top1{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.res .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res .rh b{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:620;font-size:13px}
.res .rm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10.5px;color:var(--muted)}
.res .rm span b{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--ink);font-weight:500;white-space:nowrap}
.ai-out{font-size:12px;white-space:pre-wrap;background:var(--surface-2);border-radius:9px;padding:8px}

/* ===== palco ===== */
.viewbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;pointer-events:none;align-items:flex-start}
.viewbar>*{pointer-events:auto}
.viewbar .seg,.viewbar>.btn,.legend,.hint,.sunbox,.cfdbar,.cfdlegend,.cfdprobe,.planleg,.calib{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.viewbar .seg{border-radius:12px;padding:3px}
.viewbar .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.viewbar .grow{flex:1}
.legend,.planleg{position:absolute;right:12px;bottom:12px;z-index:3;border-radius:12px;padding:9px 11px;font-size:11.5px;display:grid;gap:4px;max-width:240px;max-height:calc(100% - 90px);overflow:auto}
.legend b,.planleg b,.cfdlegend b{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:650}
.legend i,.planleg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;border:1px solid var(--line)}
.hint{pointer-events:none;position:absolute;left:12px;bottom:12px;max-width:min(62%,460px);border-radius:12px;padding:8px 12px;font-size:12px;z-index:3}
.hint::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mark);margin-right:8px;vertical-align:1px}
.sunbox{position:absolute;right:12px;top:60px;z-index:4;border-radius:12px;padding:10px 12px;width:240px;font-size:12px;display:grid;gap:5px}
.sunbox .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono)}
.calib{position:absolute;top:104px;left:12px;z-index:4;border-radius:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;font-size:12.5px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.calib input{width:80px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface-2);font-family:var(--f-mono)}
.cfdbar{position:absolute;left:12px;bottom:12px;z-index:4;border-radius:14px;padding:8px 10px;max-width:min(640px,calc(100% - 270px));display:grid;gap:6px}
.cfdbar .chips .chip{padding:4px 10px}
.cfdbar select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 6px;font-size:12px}
.cfstat{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.cfdlegend{position:absolute;right:12px;top:60px;z-index:4;border-radius:12px;padding:9px 11px;width:230px;font-size:11.5px;display:grid;gap:5px}
.cfdlegend .cbar{height:8px;border-radius:4px}
.cfdlegend .cl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px}
.cfdlegend .lnote{color:var(--muted);font-size:10.5px}
.cfdlegend .lw{display:flex;align-items:center;gap:6px}.cfdlegend .lw i{width:12px;height:10px;border-radius:2px;display:inline-block}
.cfdprobe{position:absolute;right:12px;bottom:12px;z-index:5;width:280px;font-size:12px;border-radius:14px;padding:10px 12px}
.cfdprobe .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cfdprobe .tbl td{padding:3px 0}
.cfchips{display:flex;gap:4px;flex-wrap:wrap}
.cfdbar .pill{font-family:var(--f-body)}

/* régua de indicadores */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line)}
.kpi{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-family:var(--f-display);font-variation-settings:"wdth" 115;font-size:9.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-display);font-variation-settings:"wdth" 100;font-size:17px;font-weight:620;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:12px;font-size:12.5px;z-index:40;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== apresentação (tela cheia, só leitura) ===== */
.ap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 30% 0%,var(--stage-a),var(--stage-b));color:var(--ink);--ap-acc:var(--accent)}
.ap-top{display:flex;align-items:center;gap:16px;padding:14px 24px;flex:none;z-index:3}
.ap-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 0;font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:700;font-size:13.5px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.ap-brand svg{width:22px;height:22px;flex:none}.ap-brand img{height:28px;max-width:130px;object-fit:contain;border-radius:3px}.ap-brand .n{overflow:hidden;text-overflow:ellipsis}
:root[data-theme="dark"] .ap-brand img{background:#fff;padding:3px 7px;border-radius:7px}
.ap-prog{display:flex;justify-content:center;gap:4px;flex:none}
.ap-prog button{position:relative;width:46px;height:22px;border:0;background:none;padding:0}
.ap-prog button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:var(--line-2);transition:background .3s}
.ap-prog button.vis::after{background:color-mix(in srgb,var(--ap-acc) 45%,var(--line-2))}
.ap-prog button[aria-current="step"]::after{background:var(--ap-acc)}
.ap-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex:1 1 0}
.ap-main{position:relative;flex:1;min-height:0}
.ap-3d{position:absolute;inset:0;transition:opacity .35s}
.ap-3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ap[data-slot="off"] .ap-3d{opacity:0;pointer-events:none}
.ap[data-slot="side"] .ap-3d{left:52%;right:24px;top:2px;bottom:6px;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.ap-slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 32px 18px;pointer-events:none;scrollbar-width:thin}
.ap-slide>*{pointer-events:auto}
.aps{max-width:1240px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;animation:apIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes apIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aps .eb{font-family:var(--f-display);font-variation-settings:"wdth" 115;font-size:10.5px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.aps .eb::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--ap-acc)}
.aps h1,.aps h2{font-family:var(--f-display);font-variation-settings:"wdth" 108;font-weight:640;letter-spacing:-.015em;line-height:1.1;margin:8px 0 6px}
.aps h1{font-size:clamp(28px,3.6vw,50px)}.aps h2{font-size:clamp(22px,2.5vw,34px)}
.aps .lead{color:var(--ink-2);font-size:clamp(13.5px,1.25vw,16px);margin:0 0 14px;max-width:62ch}
.aps-hero{justify-content:flex-end;min-height:100%;padding-bottom:6px}
.aps-cap{max-width:560px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--glass-line);border-radius:22px;padding:22px 26px;box-shadow:var(--shadow)}
.aps-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aps-chips span{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:12px;font-family:var(--f-mono);color:var(--ink-2)}
.aps-chips b{font-family:var(--f-display);font-weight:620;color:var(--ink)}
.aps-split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:center}
.aps-plan{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface-2);aspect-ratio:1.18}
.aps-plan canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.ap-slide.noanim .aps{animation:none}.ap-slide{touch-action:pan-y}
.aps-num{align-items:center}
.aps-prod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
.aps-col{display:grid;gap:14px;align-content:center;min-width:0}
.aps-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.aps-tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.aps-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.aps-tile.hl{background:linear-gradient(160deg,var(--accent-2),var(--surface) 75%)}
.aps-tile .l{font-family:var(--f-display);font-variation-settings:"wdth" 115;font-size:10px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.aps-tile .v{font-family:var(--f-display);font-variation-settings:"wdth" 100;font-size:clamp(20px,2.4vw,34px);font-weight:620;letter-spacing:-.015em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aps-tile .s{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:1px}
.aps-tile .v.ok{color:var(--ok)}.aps-tile .v.warn{color:var(--warn)}.aps-tile .v.bad{color:var(--bad)}
.aps-card{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px;min-width:0}
.aps-card h3{margin:0 0 8px;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.aps-use{display:grid;gap:10px}.aps-use .ur{display:grid;grid-template-columns:110px 1fr 54px;gap:12px;align-items:center;font-size:12.5px}.aps-use .ur span:last-child{text-align:right;font-family:var(--f-mono)}
.aps-tw{overflow:auto;max-height:min(52vh,520px);border:1px solid var(--line);border-radius:16px;background:var(--surface);-webkit-overflow-scrolling:touch}
.aps-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.aps-tbl th{position:sticky;top:0;background:var(--surface-2);font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:10.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
.aps-tbl td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.aps-tbl tr:last-child td{border-bottom:0}
.aps-tbl .n{text-align:right;font-family:var(--f-mono);font-size:12px}
.aps-tbl tr.tot td{font-weight:650;background:var(--surface-2)}
.aps-sol{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mark)}
.aps-sum{display:flex;flex-wrap:wrap;gap:8px 28px;margin:2px 0 14px}.aps-sum div{display:grid}.aps-sum .l{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-display)}.aps-sum .v{font-family:var(--f-display);font-size:clamp(18px,2vw,26px);font-weight:620}
.aps-foot{font-size:11px;color:var(--muted);margin-top:12px;max-width:80ch}
.aps-pills{display:flex;flex-wrap:wrap;gap:6px}
.ap-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px calc(16px + env(safe-area-inset-bottom,0px));flex:none;z-index:3}
.ap-step{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-step b{color:var(--ink);font-weight:500}
.ap-msg{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;z-index:4;background:var(--bg)}

        <div class="seg" id="viewSeg" role="group" aria-label="Vista"><button data-v="3d">3D</button><button data-v="impl">Implantação</button><button data-v="gar">Garagem</button><button data-v="tipo">Tipo</button><button data-v="andar">Andares</button><button data-v="clima">Mapas</button><button data-v="v3d">Vento 3D</button></div>
        <span class="vbreak" aria-hidden="true"></span>
        <div class="seg" id="floorSeg" hidden></div>
        <div class="seg" id="towerSeg" hidden></div>
        <div class="seg" id="andarBox" hidden><button id="andarDn" aria-label="Andar abaixo">▼</button><select id="andarSel" aria-label="Andar"></select><button id="andarUp" aria-label="Andar acima">▲</button><button id="andar3d">Ver no 3D</button></div>
        <div class="seg" id="corteBox" hidden><select id="corteSel" aria-label="Corte por andar"></select></div>
        <div class="seg" id="climaSeg" hidden><button data-cm="sol">Horas de sol</button><button data-cm="vento">Vento no chão</button></div>
        <span class="grow"></span>
        <div class="vacts">
          <button class="btn" id="legBtn" hidden aria-pressed="false" title="Mostrar ou esconder a legenda"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><rect x="4" y="5" width="4" height="4" rx="1"/><rect x="4" y="15" width="4" height="4" rx="1"/><path d="M11 7h9M11 17h9"/></svg><span class="lb">Legenda</span></button>
          <button class="btn" id="sunBtn" hidden title="Sol e sombra na maquete" aria-label="Sol e sombra"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg><span class="lb">Sol</span></button>
          <button class="btn" id="fitBtn" title="Enquadrar a vista" aria-label="Enquadrar"><svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
        </div>
      </div>
      <!-- ferramentas da vista (o que o toque/clique faz), agrupadas num painel só -->
      <div class="vtools" id="vtools" role="toolbar" aria-label="Ferramentas da vista">
        <div class="seg" id="toolSeg" hidden>
          <button data-t="edit" title="Arrastar vértices, mover prédios do entorno e a vista">Editar</button>
          <button data-t="draw" data-dt="lote" title="Desenhar o lote ponto a ponto">Desenhar lote</button>
          <button data-t="draw" data-dt="entorno" title="Desenhar um volume vizinho">Entorno</button>
          <button data-t="img" title="Arrastar a imagem de fundo">Mover imagem</button>
          <button data-t="calib" title="Clique dois pontos de distância conhecida">Calibrar</button>
        </div>
        <div class="seg" id="rampSeg" hidden><button id="rampMove" title="Arrastar a rampa">Mover rampa</button><button id="rampRot" title="Girar a rampa 90°">Girar</button><button id="rampAuto" title="Voltar ao posicionamento automático">Auto</button></div>
        <div class="seg" id="tapSeg" hidden><button data-tm="off">Tirar / devolver</button><button data-tm="n">Comum</button><button data-tm="pcd">PCD</button><button data-tm="idoso">Idoso</button></div>
      </div>
      <canvas id="c3d"></canvas>
      <canvas id="c2d" hidden></canvas>
      <div class="sunbox" id="sunBox" hidden>
        <div class="r"><b style="font-family:var(--f-display)">Insolação</b><span id="sunInfo"></span></div>
        <label for="sunMes" class="note">Data</label><input id="sunMes" type="range" min="1" max="12" step="1">
        <label for="sunHora" class="note">Hora solar</label><input id="sunHora" type="range" min="6" max="19" step="0.25">
        <div class="r"><button class="btn sm" data-sd="12,21">Verão</button><button class="btn sm" data-sd="3,21">Equinócio</button><button class="btn sm" data-sd="6,21">Inverno</button></div>
        <button class="btn sm pri" id="sunPlay">▶ Animar o dia</button>
      </div>
      <div class="cfdbar" id="cfdBar" hidden></div>
      <div class="cfdlegend" id="cfdLegend" hidden></div>
      <div class="cfdprobe" id="cfdProbe" hidden></div>
      <div class="calib" id="calibBox" hidden>Distância real entre os 2 pontos <input id="calibDist" type="number" step="0.01" value="10"> m <button class="btn pri sm" id="calibOk">Aplicar</button><button class="btn sm" id="calibCancel">Cancelar</button></div>
      <div class="hint" id="hint" hidden></div>
      <div class="planleg" id="planLeg" hidden></div>
      <div class="legend" id="legend">
        <b>Legenda</b>
        <div><i style="background:var(--m-tipo)"></i>Pavimento tipo</div>
        <div><i style="background:var(--m-cob)"></i>Cobertura / duplex</div>
        <div><i style="background:var(--m-loja)"></i>Lojas</div>
        <div><i style="background:var(--m-ter)"></i>Hall e lazer</div>
        <div><i style="background:var(--lz-c)"></i>Lazer (laje e rooftop)</div>
        <div><i style="background:var(--m-gar)"></i>Garagem</div>
        <div><i style="background:var(--m-sub)"></i>Subsolo</div>
        <div><i style="background:var(--m-viz)"></i>Entorno</div>
        <div><i style="background:transparent;border-color:var(--m-env)"></i>Envelope máximo</div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>
</div>
