<title>Gabarito Viabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Direção: estúdio de arquitetura — porcelana fria e grafite, vidro fosco sobre o palco, teal de vidro para ações e amarelo de obra só para marcações de projeto.
   Estrutura: trilho de etapas (o processo) · inspetor da etapa · palco (maquete, plantas, simulações) com régua de indicadores. */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#eceff2; --ink:#14202a; --ink-2:#34434f; --muted:#6a7884; --line:#e0e5ea; --line-2:#cfd6dc;
  --accent:#1c6878; --accent-2:#e3f0f2; --accent-ink:#ffffff; --mark:#d49c17; --ok:#2e8b62; --warn:#c0811a; --bad:#c2493a;
  --glass:rgba(255,255,255,.80); --glass-line:rgba(20,32,42,.08); --shadow:0 12px 32px rgba(20,32,42,.10),0 1px 2px rgba(20,32,42,.06); --shadow-s:0 1px 2px rgba(20,32,42,.08);
  --m-sub:#8d969c; --m-gar:#b6bec4; --m-ter:#8db8cf; --m-tipo:#fbfbf9; --m-lote:#d3e0cc; --m-env:#c2493a; --m-loja:#e2b983; --m-cob:#d7c49a; --m-viz:#c3c9ce;
  --u1:#b5d0e2; --u2:#ecd3ae; --u3:#c4dcbc; --u4:#e2c0ca; --u5:#cec5e6;
  --c-circ:#e7ebee; --c-sac:#b5e0e4; --c-esc:#efe9de; --c-ant:#e2edf1; --c-duto:#f4e6bd; --c-balc:#d9f0eb; --c-elev:#d5dde3; --c-emerg:#f1d8cf; --c-shaft:#dde1e4; --c-hall:#ffffff; --c-tec:#eef0f1; --c-pass:#ffffff; --c-lixo:#e6e1d8; --c-hserv:#f4f6f7; --c-drive:#d5d9dc; --lz-c:#d8e8d0; --lz-agua:#a9d9e6; --lz-deck:#ead9bd;
  --stage-a:#f7f9fa; --stage-b:#e2e8ec;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1115; --surface:#121a1f; --surface-2:#182229; --surface-3:#1d2830; --ink:#e7edf0; --ink-2:#c3ced5; --muted:#8c9aa4; --line:#232f37; --line-2:#2e3c46;
  --accent:#5fb7c4; --accent-2:#173238; --accent-ink:#071419; --mark:#e6b544; --ok:#5cc391; --warn:#e5a94f; --bad:#ef7d66;
  --glass:rgba(18,26,31,.80); --glass-line:rgba(231,237,240,.08); --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --m-sub:#4d575d; --m-gar:#5f6a71; --m-ter:#3d7590; --m-tipo:#dfe3e2; --m-lote:#2f4232; --m-env:#ef7d66; --m-loja:#b98a4d; --m-cob:#a5935f; --m-viz:#4d565c;
  --u1:#3c6680; --u2:#87683d; --u3:#4d6f47; --u4:#7f4f5c; --u5:#5c5385;
  --c-circ:#26323a; --c-sac:#2f7c84; --c-esc:#3a3830; --c-ant:#2a3a42; --c-duto:#5a4d22; --c-balc:#28463f; --c-elev:#33414b; --c-emerg:#4d3029; --c-shaft:#30393f; --c-hall:#121a1f; --c-tec:#1c252b; --c-pass:#121a1f; --c-lixo:#2f2c27; --c-hserv:#18232a; --c-drive:#2a333a; --lz-c:#2f4a37; --lz-agua:#2b6878; --lz-deck:#5e4f37;
  --stage-a:#172128; --stage-b:#0b1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1115; --surface:#121a1f; --surface-2:#182229; --surface-3:#1d2830; --ink:#e7edf0; --ink-2:#c3ced5; --muted:#8c9aa4; --line:#232f37; --line-2:#2e3c46;
  --accent:#5fb7c4; --accent-2:#173238; --accent-ink:#071419; --mark:#e6b544; --ok:#5cc391; --warn:#e5a94f; --bad:#ef7d66;
  --glass:rgba(18,26,31,.80); --glass-line:rgba(231,237,240,.08); --shadow:0 12px 32px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --m-sub:#4d575d; --m-gar:#5f6a71; --m-ter:#3d7590; --m-tipo:#dfe3e2; --m-lote:#2f4232; --m-env:#ef7d66; --m-loja:#b98a4d; --m-cob:#a5935f; --m-viz:#4d565c;
  --u1:#3c6680; --u2:#87683d; --u3:#4d6f47; --u4:#7f4f5c; --u5:#5c5385;
  --c-circ:#26323a; --c-sac:#2f7c84; --c-esc:#3a3830; --c-ant:#2a3a42; --c-duto:#5a4d22; --c-balc:#28463f; --c-elev:#33414b; --c-emerg:#4d3029; --c-shaft:#30393f; --c-hall:#121a1f; --c-tec:#1c252b; --c-pass:#121a1f; --c-lixo:#2f2c27; --c-hserv:#18232a; --c-drive:#2a333a; --lz-c:#2f4a37; --lz-agua:#2b6878; --lz-deck:#5e4f37;
  --stage-a:#172128; --stage-b:#0b1115; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== estrutura ===== */
.app{display:grid;grid-template-columns:78px 384px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.app>*{min-width:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px 0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.top .sep{width:1px;height:22px;background:var(--line)}
.top .proj{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.top .proj input{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:500;min-width:0;width:min(320px,100%);transition:background .15s,border-color .15s}
.top .proj input:hover{background:var(--surface-2)}
.top .proj input:focus{background:var(--surface-2);border-color:var(--accent);outline:none}
.top .acts{display:flex;gap:8px;align-items:center}
.btn.icon{padding:7px 10px}.btn.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.icon .tl{font-size:12px}
.i-sun{display:none}:root[data-theme="dark"] .i-sun{display:block}:root[data-theme="dark"] .i-moon{display:none}
.rail{grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:2px;padding:12px 8px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.rail button{position:relative;display:grid;justify-items:center;gap:5px;padding:10px 2px 9px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.01em;transition:background .15s,color .15s}
.rail button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:var(--ink);background:var(--surface-2)}
.rail button[aria-current="page"]{color:var(--ink);background:var(--accent-2)}
.rail button[aria-current="page"] svg{stroke:var(--accent)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rail .st{position:absolute;top:8px;right:14px;width:7px;height:7px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}
.panel{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.phead{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.phead .eb{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phead h1{font-family:var(--f-display);font-variation-settings:"wdth" 112;font-weight:650;font-size:21px;letter-spacing:-.005em;margin:3px 0 4px}
.phead p{margin:0;color:var(--muted);font-size:12.5px}
.phead .sub{margin-top:12px}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
.pbody>*{flex:none}
.pfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface)}
.stage{grid-row:2;grid-column:3;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.view{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,var(--stage-a),var(--stage-b))}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
#c3d,#c2d{position:absolute;inset:0}

/* ===== componentes ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px 9px}
.card>.ch h2{margin:0;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:13.5px;font-weight:620;letter-spacing:.005em}
.card>.ch .aside{font-size:11.5px;color:var(--muted)}
.card>.cb{padding:2px 14px 14px;display:grid;gap:10px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card.hero{background:linear-gradient(160deg,var(--accent-2),var(--surface) 70%);border-color:var(--line)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-family:var(--f-display);font-variation-settings:"wdth" 110;font-size:13.5px;font-weight:620}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);transition:transform .18s;margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>.cb{padding-top:0}
.grp{font-family:var(--f-display);font-variation-settings:"wdth" 118;font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 0 -2px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kv.three{grid-template-columns:1fr 1fr 1fr}
.fld{display:grid;gap:4px;min-width:0;align-content:start}
.fld.wide{grid-column:1/-1}
.fl{font-size:11.5px;color:var(--ink-2);display:flex;gap:5px;align-items:center;min-width:0}
.fl .hlp{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--surface-3);color:var(--muted);font-size:9.5px;font-style:normal;font-weight:600;cursor:help;flex:none}
.inp{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;min-width:0;transition:border-color .15s,background .15s}
.inp:hover{border-color:var(--line-2)}
.inp:focus-within{border-color:var(--accent);background:var(--surface)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:7px 9px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;outline:none}
.inp input.t{font-family:var(--f-body)}
.inp em{font-style:normal;font-size:11px;color:var(--muted);padding-right:9px;white-space:nowrap}
.fsub{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.fsub:empty{display:none}
select.sel,.txt,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
select.sel:focus,.txt:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:76px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.stp{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{border:0;background:none;height:32px;font-size:16px;color:var(--ink-2)}
.stp button:hover{background:var(--surface-3)}
.stp input{border:0;background:transparent;text-align:center;font-family:var(--f-mono);font-size:13px;width:100%;min-width:0;outline:none;padding:6px 0}
.sl{display:grid;gap:3px}
.sl .slh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2)}
.sl .slh output{font-family:var(--f-mono);color:var(--ink);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:22px;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent)) 0/var(--fill,50%) 100% no-repeat,var(--line-2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.sw{display:flex;align-items:center;gap:10px;font-size:12.5px;cursor:pointer;user-select:none;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tg{width:32px;height:18px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw .tg::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.tg{background:var(--accent)}
.sw input:checked+.tg::after{transform:translateX(14px)}
.sw input:focus-visible+.tg{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.on{background:var(--mark);border-color:var(--mark);color:#1c1606}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:8px;padding:5px 10px;font-weight:500;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s),0 0 0 1px var(--line)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg select{border:0;background:transparent;padding:4px 6px;font-size:12.5px;max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{background:var(--accent-ink);border-color:var(--accent-ink)}
.pill{display:inline-block;border-radius:20px;font-size:10.5px;font-family:var(--f-mono);padding:2px 8px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.note{color:var(--muted);font-size:11.5px;margin:0;line-height:1.5}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:5px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap;padding-left:8px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
.tbl tr.neg td:last-child{color:var(--bad)}
.tbl tr.pos td:last-child{color:var(--ok)}
.tbl.multi td:not(:first-child),.tbl.multi th:not(:first-child){text-align:right;font-family:var(--f-mono);font-size:11.5px;padding-left:10px;white-space:nowrap}
.tbl.multi th{font-family:var(--f-body);font-size:11.5px;font-weight:600;white-space:normal;min-width:90px;max-width:150px}
.tbl .best{color:var(--ok);font-weight:600}
.scroll{overflow-x:auto}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.met .l{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.met .v{font-family:var(--f-display);font-variation-settings:"wdth" 100;font-size:19px;font-weight:620;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.met .s{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.met.big{grid-column:1/-1}.met.big .v{font-size:26px}
.bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.ok i{background:var(--ok)}
.use{display:grid;gap:9px}
.use .ur{display:grid;grid-template-columns:104px 1fr 64px;gap:10px;align-items:center;font-size:11.5px}
.use .ur span:last-child{text-align:right;font-family:var(--f-mono)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden}
.stack span{display:block;height:100%}
.stackleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted)}
.stackleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sens{display:grid;grid-template-columns:70px repeat(3,1fr);gap:3px;font-family:var(--f-mono);font-size:11.5px;text-align:center}
.sens div{padding:6px 2px;border-radius:6px}
.sens .h{color:var(--muted);font-size:10.5px;background:none}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;transition:border-color .15s,background .15s}

.lzr>:nth-child(1){grid-area:n}.lzr>:nth-child(2){grid-area:a}.lzr>:nth-child(3){grid-area:l}.lzr>:nth-child(4){grid-area:t;justify-self:stretch;text-align:center;padding:6px 8px}.lzr>:nth-child(5){grid-area:x}
.lzr .lzm{grid-area:m;font-size:11px;color:var(--bad)}
.chip[hidden]{display:none}
.sw8{width:10px;height:10px;border-radius:3px;border:1px solid var(--line-2)}
.x{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;padding:4px 0}
.x:hover{color:var(--bad)}
.edge{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--surface-2);border:1px solid transparent}
.edge.front{border-color:color-mix(in srgb,var(--mark) 60%,transparent);box-shadow:inset 3px 0 0 var(--mark)}
.edge b{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:500}
.edge .inp{max-width:130px}

.viewbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;pointer-events:none;align-items:flex-start}

/* ================= garagem: circulação vertical, layout de vagas, manobra e rotas ================= */
/* Modelo:

     "alternada" (tesoura): duas faixas lado a lado, com sentidos opostos; chegada e partida na mesma ponta (retorno em U).
   - Rampas que descem (subsolos) e que sobem (garagens elevadas) ficam em faixas diferentes, lado a lado na entrada.
   - Cada ponta de rampa tem um patamar plano (sem vagas) e um "portal" que precisa estar ligado à circulação.
   - O layout de vagas é gerado por fileiras e validado numa malha de 0,5 m: o carro (folga mínima de 2,4 m)

/* início e comprimento das faixas de rampa (modo automático) */

function vertical(st, m){

  raw.map((r,i)=>[r-q[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{ if(rest>0){ q[i]++; rest-- } });

}
function potencial(st, m){

  const bruto=Math.max(0,Math.min(brutoPorCA, brutoPorVol)), limita = brutoPorCA<=brutoPorVol? "ca" : "altura";

  return {compMax, compBas, pavH, bruto, priv, un, limita, vgv: bruto*P.efic*basePrice(st) + m.lojaPriv*st.fin.precoLoja,
    uso:{ ca:m.CA/Math.max(1e-9,R.caMax), to:m.TO/Math.max(1e-9,R.toEmb), h:m.H/Math.max(1e-9,R.hMax), priv:m.priv/Math.max(1,priv) } };
}

function otimizar(opts, onProg, onDone){

/* ================= clima: entorno, horas de sol e vento ================= */
function prisms(st, m){
  const P=st.produto, out=[];
  if(m.emb.length) out.push({poly:m.emb, z0:0, z1:m.hEmb, own:true});
  m.T.forEach(t=>{ if(t.plate.length) out.push({poly:t.plate, z0:m.hEmb, z1:t.H, own:true}) });
  (st.entorno||[]).forEach(e=>{ if(e.pts&&e.pts.length>2) out.push({poly:e.pts, z0:0, z1:+e.h||0, own:false}) });
  out.forEach(p=>{ const xs=p.poly.map(q=>q[0]), ys=p.poly.map(q=>q[1]); p.bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)] });
  return out;
}
function sunVectorAt(mes, dia, hora){
  const lat=S.lote.lat*Math.PI/180;
  const n = Math.floor((Date.UTC(2026,mes-1,dia)-Date.UTC(2026,0,0))/864e5);
  const dec = 23.44*Math.PI/180*Math.sin(2*Math.PI*(284+n)/365), Hh=(hora-12)*15*Math.PI/180;
  const alt=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(Hh));
  const az=Math.atan2(Math.sin(Hh), Math.cos(Hh)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))+Math.PI;
  const th=(S.lote.norte||0)*Math.PI/180, north=[Math.sin(th),Math.cos(th)], east=[Math.cos(th),-Math.sin(th)];
  const e=Math.sin(az)*Math.cos(alt), nn=Math.cos(az)*Math.cos(alt);
  return {alt, x:east[0]*e+north[0]*nn, y:east[1]*e+north[1]*nn, z:Math.sin(alt)};
}
function domainOf(st, m, margin){
  const pts=[...st.lote.pts, ...(st.entorno||[]).flatMap(e=>e.pts||[])];
  const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]);
  return [Math.min(...xs)-margin, Math.min(...ys)-margin, Math.max(...xs)+margin, Math.max(...ys)+margin];
}
let _sunCache=null;
function sunHours(st, m){
  const PR=prisms(st,m), sig=JSON.stringify([PR.map(p=>[p.poly,p.z1]), st.sol.mes, st.sol.dia, st.lote.lat, st.lote.norte]);
  if(_sunCache && _sunCache.sig===sig) return _sunCache;
  const [x0,y0,x1,y1]=domainOf(st,m,25), span=Math.max(x1-x0,y1-y0), cs=Math.max(0.75, span/120);
  const nx=Math.ceil((x1-x0)/cs), ny=Math.ceil((y1-y0)/cs), data=new Float32Array(nx*ny);
  const suns=[]; for(let h=5;h<=19.5;h+=0.5){ const v=sunVectorAt(st.sol.mes, st.sol.dia, h); if(v.alt>0.01) suns.push(v) }
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const p=[x0+(i+0.5)*cs, y0+(j+0.5)*cs];
    if(PR.some(q=>p[0]>=q.bb[0]&&p[0]<=q.bb[2]&&p[1]>=q.bb[1]&&p[1]<=q.bb[3]&&q.z0===0&&G.pip(p,q.poly))){ data[j*nx+i]=NaN; continue }

        const t0=q.z0/s.z, t1=q.z1/s.z, a=[p[0]+s.x*t0, p[1]+s.y*t0], b=[p[0]+s.x*t1, p[1]+s.y*t1];
        if(Math.max(a[0],b[0])<q.bb[0]||Math.min(a[0],b[0])>q.bb[2]||Math.max(a[1],b[1])<q.bb[1]||Math.min(a[1],b[1])>q.bb[3]) continue;

      if(!sh) lit++;

/* ---------- vento: Lattice Boltzmann D2Q9 numa fatia horizontal ---------- */
const WIND = { sig:null, steps:0, running:false };
const EX=[0,1,0,-1,0,1,-1,-1,1], EY=[0,0,1,0,-1,1,1,-1,-1], WQ=[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36], OPP=[0,3,4,1,2,7,8,5,6];
function windFlowDir(st){ // direção para onde o vento sopra, no referencial do desenho
  const th=(S.lote.norte||0)*Math.PI/180, north=[Math.sin(th),Math.cos(th)], east=[Math.cos(th),-Math.sin(th)];
  const ph=st.clima.ventoDir*Math.PI/180, from=[Math.cos(ph)*north[0]+Math.sin(ph)*east[0], Math.cos(ph)*north[1]+Math.sin(ph)*east[1]];

function windSetup(st, m){

function windStep(n){

const G = (() => {

function coreSeq(o){

  const grp=(second)=>{ const fr=[], bk=[];

/* reparo: abre passagens (tirando o mínimo de vagas) até a rampa e os trechos de corredor que ficaram isolados */

function prisms(st, m){

}
function sunVectorAt(mes, dia, hora){

  const th=(S.lote.norte||0)*Math.PI/180, north=[Math.sin(th),Math.cos(th)], east=[Math.cos(th),-Math.sin(th)];
  const e=Math.sin(az)*Math.cos(alt), nn=Math.cos(az)*Math.cos(alt);

}

function genNeighbors(){
  const L=S.lote.pts, out=[];
  L.forEach((a,i)=>{ const b=L[(i+1)%L.length], dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy); if(l<3) return; const n=[dy/l,-dx/l];
    const front=S.lote.front.includes(i), gap= front? 16 : 1.5, dep= front? 18 : 14, h= front? 15 : (i%2? 24 : 9);
    const p=[[a[0]+n[0]*gap,a[1]+n[1]*gap],[b[0]+n[0]*gap,b[1]+n[1]*gap],[b[0]+n[0]*(gap+dep),b[1]+n[1]*(gap+dep)],[a[0]+n[0]*(gap+dep),a[1]+n[1]*(gap+dep)]];
    out.push({pts:p, h, nome: front? "Quadra em frente" : "Vizinho L"+(i+1)}) });
  S.entorno=out;
}

function importCoords(raw){
  let pairs=[];
  const kml=raw.match(/<coordinates>([\s\S]*?)<\/coordinates>/i);
  if(kml){ kml[1].trim().split(/\s+/).forEach(t=>{ const [lon,lat]=t.split(",").map(Number); if(isFinite(lat)&&isFinite(lon)) pairs.push([lat,lon]) }) }
  else raw.split(/\n/).forEach(l=>{ const n=l.match(/-?\d+(?:\.\d+)?/g); if(n&&n.length>=2) pairs.push([+n[0],+n[1]]) });
  if(pairs.length>2 && Math.abs(pairs[0][0]-pairs.at(-1)[0])<1e-9 && Math.abs(pairs[0][1]-pairs.at(-1)[1])<1e-9) pairs.pop();
  if(pairs.length<3){ toast("Preciso de pelo menos 3 pontos"); return }
  const lat0=pairs.reduce((s,p)=>s+p[0],0)/pairs.length, lon0=pairs.reduce((s,p)=>s+p[1],0)/pairs.length, R=6371008.8, k=Math.PI/180;
  S.lote.pts=pairs.map(([la,lo])=>[(lo-lon0)*k*R*Math.cos(lat0*k), (la-lat0)*k*R]); S.lote.front=[]; S.lote.rec=S.lote.pts.map(()=>({})); normalizeLote(); S.lote.front=[0]; S.lote.principal=0;
  S.lote.lat=+lat0.toFixed(4); S.lote.lon=+lon0.toFixed(4); S.lote.norte=0;
  renderTab(); fit2d(); fit3d(); toast(`${pairs.length} pontos importados · ${m2(G.area(S.lote.pts))}`);
}
function normalizeLote(){ const L=S.lote; if(L.pts.length<3) return; ensureRec();
  if(G.sArea(L.pts)<0){ const n=L.pts.length, mp=i=>((n-2-i)%n+n)%n; L.pts=L.pts.slice().reverse(); L.front=L.front.map(mp); L.principal=mp(L.principal); const r=L.rec.slice(); L.rec=r.map((_,i)=>r[mp(i)]) }
  if(!L.front.includes(L.principal)) L.principal=L.front[0]??0 }
function ensureRec(){ const L=S.lote; if(!Array.isArray(L.rec)) L.rec=[]; while(L.rec.length<L.pts.length) L.rec.push({}); if(L.rec.length>L.pts.length) L.rec.length=L.pts.length }
function edgeInsert(mI){ const L=S.lote; ensureRec(); L.front=L.front.flatMap(i=> i===mI?[i,i+1]: i>mI?[i+1]:[i]); if(L.principal>mI) L.principal++; L.rec.splice(mI+1,0,{...L.rec[mI]}) }

function cashSVG(f){
  const W=360,H=150,pl=44,pr=8,pt=10,pb=22, cum=f.cumA, n=cum.length;
  const mn=Math.min(0,...cum), mx=Math.max(0,...cum), sx=i=>pl+(W-pl-pr)*i/(n-1), sy=v=>pt+(H-pt-pb)*(mx-v)/((mx-mn)||1);
  const path=cum.map((v,i)=>(i?"L":"M")+sx(i).toFixed(1)+","+sy(v).toFixed(1)).join("");
  const ar=`M${sx(0)},${sy(0)} `+cum.map((v,i)=>"L"+sx(i).toFixed(1)+","+sy(v).toFixed(1)).join("")+` L${sx(n-1)},${sy(0)} Z`;
  const ticks=[mn,0,mx].filter((v,i,a)=>a.indexOf(v)===i), iMin=cum.indexOf(Math.min(...cum));
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Fluxo de caixa acumulado">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.2"':'stroke-dasharray="2 3"'}/><text x="${pl-4}" y="${sy(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono">${v===0?"0":nf(v/1e6,1)+"mi"}</text>`).join("")}
    <line x1="${sx(f.launch)}" x2="${sx(f.launch)}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx(f.launch)+3}" y="${H-pb+12}" font-size="9" fill="var(--muted)">lançamento</text>
    <line x1="${sx(f.chaves)}" x2="${sx(f.chaves)}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx(f.chaves)-3}" y="${H-pb+12}" font-size="9" text-anchor="end" fill="var(--muted)">chaves</text>
    <path d="${ar}" fill="var(--accent)" fill-opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <circle cx="${sx(iMin)}" cy="${sy(cum[iMin])}" r="3" fill="var(--bad)"/><circle cx="${sx(n-1)}" cy="${sy(cum[n-1])}" r="3" fill="var(--accent)"/>
    <text x="${sx(iMin)+5}" y="${sy(cum[iMin])+11}" font-size="9" fill="var(--bad)" font-family="IBM Plex Mono">exposição ${mi(cum[iMin])}</text>
  </svg>`;
}
/* rosa dos ventos clicável */
function compassSVG(cur){
  const dirs=[["N",0],["NE",45],["L",90],["SE",135],["S",180],["SO",225],["O",270],["NO",315]], R=72, c=89, th=(S.lote.norte||0);
  const pt=(a,r)=>[c+r*Math.sin(a*Math.PI/180), c-r*Math.cos(a*Math.PI/180)];
  const [ax,ay]=pt(cur,R-22), [bx,by]=pt(cur+180,30);
  return `<div class="compass"><svg viewBox="0 0 178 178" role="group" aria-label="Direção de onde o vento vem">
    <circle cx="${c}" cy="${c}" r="${R-14}" fill="none" stroke="var(--line)"/><circle cx="${c}" cy="${c}" r="${R-38}" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/>
    <defs><marker id="cmpA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--accent)"/></marker></defs>
    <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#cmpA)"/>
    <text x="${c}" y="${c+44}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono">vem de ${dirs.find(d=>d[1]===cur)?.[0]||nf(cur,0)+"°"}</text>
    ${dirs.map(([l,a])=>{ const [x,y]=pt(a,R); return `<g class="cd${a===cur?" on":""}" data-act="vdir" data-v="${a}" role="button" aria-label="${l}"><circle cx="${x}" cy="${y}" r="13"/><text x="${x}" y="${y}">${l}</text></g>` }).join("")}
  </svg></div>`;
}

TB.addEventListener("change",e=>{
  const t=e.target, d=t.dataset||{};
  if(d.len!=null){ const i=+d.len, p=S.lote.pts, a=p[i], b=p[(i+1)%p.length], L=G.edgeLen(p,i), nl=+t.value, j=(i+1)%p.length; if(j===0){ toast("O último lado fecha o polígono: ajuste os outros"); update(); return } if(L>0&&nl>0){ const dx=(b[0]-a[0])/L, dy=(b[1]-a[1])/L, ox=a[0]+dx*nl-b[0], oy=a[1]+dy*nl-b[1]; for(let q=j;q<p.length;q++) p[q]=[p[q][0]+ox,p[q][1]+oy]; update() } }
  else if(d.rec!=null){ ensureRec(); S.lote.rec[+d.rec][d.rk] = t.value===""? null : Math.max(0,+t.value); update() }
  else if(t.id==="bgFile"){ const f=t.files[0]; if(!f) return; const url=URL.createObjectURL(f), img=new Image(); img.onload=()=>{ const c=G.centroid(S.lote.pts), mpp=120/img.width; BG={img,mpp,op:0.8,x:c[0]-img.width*mpp/2,y:c[1]+img.height*mpp/2}; setView("impl"); fitBG(); setTool("calib"); renderTab() }; img.src=url }
  else if(t.id==="cidSel"){ if(t.value==="") return; const c=(LS.get("gabarito.cidades")||[])[+t.value]; if(c){ S.regras=merge(clone(DEF.regras), c.regras); renderTab(); toast("Regras carregadas: "+c.nome) } }
  else if(t.id==="aiPdf") aiReadPdf(e);
  else if(t.id==="jsonIn"){ const f=t.files[0]; if(!f) return; f.text().then(x=>{ try{ const o=JSON.parse(x); S=merge(clone(DEF), o.S||o); document.getElementById("projName").value=S.nome; renderTab(); fit3d(); fit2d(); toast("Projeto aberto") }catch(err){ toast("Arquivo inválido") } }) }
  else if(d.cmp!=null){ const l=LS.get("gabarito.cenarios2")||[]; l[+d.cmp].cmp=t.checked; LS.set("gabarito.cenarios2",l); renderTab() }
});

function compareHTML(sel){
  const rows=[["Unidades","units",1,0],["Área privativa","priv",1,0],["Vagas","vagas",1,0],["CA","ca",0,2],["Altura (m)","h",-1,1],["VGV","vgv",1,"mi"],["Custo total","custo",-1,"mi"],["Lucro","lucro",1,"mi"],["Margem","margem",1,"%"],["TIR a.a.","tir",1,"%"],["Exposição máx.","exp",-1,"mi"]];
  const fmt=(v,f)=> v==null?"—": f==="mi"? mi(v) : f==="%"? pct(v) : nf(v,f);
  return `<div class="scroll"><table class="tbl multi"><tr><th></th>${sel.map(c=>`<th>${esc(c.nome)}</th>`).join("")}</tr>
  ${rows.map(([l,k,dir,f])=>{ const vals=sel.map(c=>c.k[k]); const ok=vals.filter(v=>v!=null); const best= dir===0||!ok.length? null : dir>0? Math.max(...ok) : Math.min(...ok);
    return `<tr><td>${l}</td>${vals.map(v=>`<td class="${v!=null&&v===best&&sel.length>1?"best":""}">${fmt(v,f)}</td>`).join("")}</tr>` }).join("")}</table></div>`;
}

/* ================= vistas e interação ================= */
const c2=document.getElementById("c2d"), g2=c2.getContext("2d");
let ANDAR="ter", TAPMODE="off";
let VIEW="3d", TOOL="edit", DRAWT="lote", DRAW=null, CAL=null, HOVER=null, FLOOR="s1", TOWER=0, RAMPMOVE=false;
const VS={}; // transformações por vista
function cur(){ return VS[VIEW] || (VS[VIEW]={s:5,ox:0,oy:0}) }
function size2d(){ const r=c2.getBoundingClientRect(), d=devicePixelRatio||1; c2.width=Math.max(1,r.width*d); c2.height=Math.max(1,r.height*d); g2.setTransform(d,0,0,d,0,0) }
function viewPolys(){
  const m=window._last&&window._last.m; if(!m) return [S.lote.pts];
  if(VIEW==="gar") return [floorPoly(m)||S.lote.pts];
  if(VIEW==="tipo"){ const t=m.T[TOWER]; return [t&&t.plate.length? t.plate : S.lote.pts] }
  if(VIEW==="clima") return [S.lote.pts, ...(S.entorno||[]).map(e=>e.pts).filter(p=>p&&p.length)];
  if(VIEW==="andar") return [S.lote.pts];
  return [S.lote.pts];
}
function floorPoly(m){ return FLOOR[0]==="s"? m.sub : m.emb }
function floorsList(m){
  const P=S.produto, out=[]; if(!m) return out;
  for(let k=P.subsolos;k>=1;k--) out.push({key:"s"+k, nome:`Subsolo ${k}`, tipo:"sub", lay:"s"+k, z0:-k*P.peGar, h:P.peGar});
  out.push({key:"ter", nome:"Térreo", tipo:"ter", z0:0, h:P.peTerreo});
  for(let k=1;k<=P.garAcima;k++) out.push({key:"g"+k, nome:`Garagem ${k}`, tipo:"ac", lay:"g"+k, z0:P.peTerreo+(k-1)*P.peGar, h:P.peGar});
  const maxP=Math.max(0,...m.T.map(t=>t.pav)), lz=m.lz||{emb:{},cob:{}}, dz=m.pavLz? P.pe : 0;
  if((lz.emb.c||0)+(lz.emb.d||0)>0) out.push({key:"lzemb", nome:"Laje do embasamento · lazer", tipo:"lazemb", z0:m.hEmb, h:0.3});
  if(m.pavLz) out.push({key:"lz", nome:"Pavimento de lazer (torre 1)", tipo:"pavlaz", z0:m.hEmb, h:P.pe});
  for(let j=0;j<maxP;j++){ const tw=m.T.filter(t=>t.pav>j), cob=tw.length&&tw.every(t=>t.hasCob&&t.pav-1===j); out.push({key:"p"+(j+1), nome: cob? `${j+1}º pavimento · coberturas` : `${j+1}º pavimento`, tipo:"tipo", j, z0:m.hEmb+dz+j*P.pe, h:P.pe}) }
  if(m.T.some(t=>t.duplexA>1)){ const j=Math.max(...m.T.filter(t=>t.duplexA>1).map(t=>t.pav)); out.push({key:"dup", nome:"Duplex (pavimento superior)", tipo:"duplex", z0:m.hEmb+j*P.pe, h:P.pe}) }
  if((lz.cob.c||0)+(lz.cob.d||0)>0) out.push({key:"roof", nome:"Cobertura da torre 1 · rooftop", tipo:"roof", z0:m.hEmb+dz+maxP*P.pe+(m.duplex?P.pe:0), h:3});
  if(P.atico) out.push({key:"atc", nome:"Ático técnico", tipo:"atico", z0:m.hEmb+dz+maxP*P.pe+(m.duplex?P.pe:0), h:3});
  return out;
}
function fit2d(){ if(VIEW==="3d") return; const r=c2.getBoundingClientRect(); if(!r.width) return; VS[VIEW]=fitView(viewPolys(), r.width, r.height, VIEW==="impl"?1.5:VIEW==="clima"?1.25:1.15); redraw2d() }
function fitBG(){ if(!BG) return; const r=c2.getBoundingClientRect(); const w=BG.img.width*BG.mpp, h=BG.img.height*BG.mpp; const s=Math.min(r.width/w, r.height/h)*0.95; VS.impl={s, ox:r.width/2-(BG.x+w/2)*s, oy:r.height/2+(BG.y-h/2)*s}; redraw2d() }
let T2=null;
function redraw2d(){
  if(c2.hidden || VIEW==="3d") return; const m=window._last&&window._last.m; if(!m) return;
  const r=c2.getBoundingClientRect(); const V=cur();
  const lay = VIEW==="gar" && m.gar ? m.gar[FLOOR] : null;
  const andar = VIEW==="andar"? floorsList(m).find(f=>f.key===ANDAR) : null;
  T2 = drawPlan(g2, r.width, r.height, V, VIEW, m, {handles:VIEW==="impl"&&TOOL==="edit", lay, floor:floorPoly(m), floorKey:FLOOR, tower:TOWER, kind:S.clima.modo, andar});
  if(VIEW==="gar" && !lay && FLOOR!=="ter"){ g2.font="500 13px "+css("--f-body"); g2.fillStyle=css("--muted"); g2.textAlign="center"; g2.fillText("Este pavimento não existe no produto atual.", r.width/2, r.height/2) }
  if(VIEW==="impl"){
    const w2s=T2.w2s, col = DRAWT==="entorno"? css("--muted") : DRAWT.startsWith("lim")? css("--m-env") : css("--accent");
    if(DRAW){ g2.strokeStyle=col; g2.lineWidth=2; g2.beginPath(); DRAW.forEach((q,i)=>{ const [x,y]=w2s(q); i?g2.lineTo(x,y):g2.moveTo(x,y) }); if(HOVER) g2.lineTo(...w2s(HOVER)); g2.stroke(); DRAW.forEach((q,i)=>{ const [x,y]=w2s(q); g2.fillStyle=i===0?css("--mark"):col; g2.beginPath(); g2.arc(x,y,i===0?7:4,0,7); g2.fill() }) }
    if(CAL){ g2.strokeStyle=css("--mark"); g2.lineWidth=2.5; g2.beginPath(); CAL.forEach((q,i)=>{ const [x,y]=w2s(q); i?g2.lineTo(x,y):g2.moveTo(x,y) }); if(CAL.length===1&&HOVER) g2.lineTo(...w2s(HOVER)); g2.stroke(); CAL.forEach(q=>{ const [x,y]=w2s(q); g2.fillStyle=css("--mark"); g2.beginPath(); g2.arc(x,y,5,0,7); g2.fill() }) }
  }
}
const w2s_=q=>{ const V=cur(); return [q[0]*V.s+V.ox, -q[1]*V.s+V.oy] }, s2w_=(px,py)=>{ const V=cur(); return [(px-V.ox)/V.s, -(py-V.oy)/V.s] };
let drag=null; const ptrs=new Map(); let pinch=null;
function pos(e){ const r=c2.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top] }
function editables(){ const l=[{arr:S.lote.pts,kind:"lote"}]; ["emb","tor","sub"].forEach(k=>{ if(S.custom[k]&&S.custom[k].length) l.push({arr:S.custom[k],kind:"lim"}) }); (S.entorno||[]).forEach(e=>{ if(e.pts) l.push({arr:e.pts,kind:"entorno"}) }); return l }
function hitVertex(px,py){ let best=null,bd=14; editables().forEach(ed=>ed.arr.forEach((q,i)=>{ const [x,y]=w2s_(q), d=Math.hypot(x-px,y-py); if(d<bd){ bd=d; best={arr:ed.arr,i,kind:ed.kind} } })); return best }
function hitMid(px,py){ const L=S.lote.pts; let best=-1,bd=12; L.forEach((a,i)=>{ const b=L[(i+1)%L.length], A=w2s_(a), B=w2s_(b), d=Math.hypot((A[0]+B[0])/2-px,(A[1]+B[1])/2-py); if(d<bd){ bd=d; best=i } }); return best }
const HINTSEEN={};
function finishDraw(){
  const pts=DRAW; DRAW=null;
  if(DRAWT==="lote"){ S.lote.pts=pts; S.lote.front=[]; S.lote.rec=pts.map(()=>({})); normalizeLote(); S.lote.front=[0]; S.lote.principal=0; toast("Terreno fechado. Marque as frentes e a frente principal na lista de lados.") }
  else if(DRAWT==="entorno"){ S.entorno.push({pts, h:12, nome:"Vizinho "+(S.entorno.length+1)}); toast("Volume do entorno criado com 12 m. Ajuste a altura na etapa Clima.") }
  else { const k=DRAWT.split(":")[1]; S.custom[k]=pts; toast("Limite personalizado aplicado") }
  setTool("edit"); update(); fit3d(); if(TAB==="terreno"||TAB==="clima") renderTab();
}
c2.addEventListener("pointerdown",e=>{
  if(!HINTSEEN[VIEW+TOOL]){ HINTSEEN[VIEW+TOOL]=1; document.getElementById("hint").hidden=true }
  c2.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,pos(e));
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), s:cur().s, c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}; drag=null; return }
  const [px,py]=pos(e), w=s2w_(px,py);
  if(VIEW==="andar"){ drag={type:"pan",px,py,ox:cur().ox,oy:cur().oy,moved:false,tap:w}; return }
  if(VIEW==="gar"){
    const m=window._last.m;
    if(RAMPMOVE && m.ramp){ if(!S.estudo.rampa){ const a=Math.atan2(m.ramp.dir[1],m.ramp.dir[0])*180/Math.PI; S.estudo.rampa={x:m.ramp.c[0],y:m.ramp.c[1],a} } drag={type:"ramp", start:w, x:S.estudo.rampa.x, y:S.estudo.rampa.y}; return }
    drag={type:"pan",px,py,ox:cur().ox,oy:cur().oy,moved:false,tap:w}; return }
  if(VIEW!=="impl"){ drag={type:"pan",px,py,ox:cur().ox,oy:cur().oy}; return }
  if(TOOL==="draw"){ if(!DRAW) DRAW=[]; if(DRAW.length>=3){ const f=w2s_(DRAW[0]); if(Math.hypot(f[0]-px,f[1]-py)<14){ finishDraw(); return } } DRAW.push(w); redraw2d(); return }
  if(TOOL==="calib"){ if(!CAL||CAL.length>=2) CAL=[]; CAL.push(w); if(CAL.length===2){ document.getElementById("calibBox").hidden=false; document.getElementById("calibDist").focus() } redraw2d(); return }
  if(TOOL==="img"){ if(BG) drag={type:"img", start:w, bx:BG.x, by:BG.y}; return }
  const v=hitVertex(px,py); if(v){ drag={type:"v",...v}; return }
  const mI=hitMid(px,py); if(mI>=0){ const L=S.lote.pts, a=L[mI], b=L[(mI+1)%L.length]; L.splice(mI+1,0,[(a[0]+b[0])/2,(a[1]+b[1])/2]); edgeInsert(mI); drag={type:"v",arr:L,i:mI+1,kind:"lote"}; update({fast:true}); return }
  drag={type:"pan", px,py, ox:cur().ox, oy:cur().oy};
});
c2.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,pos(e));
  if(pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]); zoomAt(pinch.c[0],pinch.c[1], pinch.s*d/pinch.d); return }
  const [px,py]=pos(e); HOVER=s2w_(px,py);
  if(!drag){ if(DRAW||(CAL&&CAL.length===1)) redraw2d(); return }
  if(drag.type==="pan"){ if(Math.hypot(px-drag.px,py-drag.py)>4) drag.moved=true; const V=cur(); V.ox=drag.ox+px-drag.px; V.oy=drag.oy+py-drag.py; redraw2d() }
  if(drag.type==="v"){ drag.arr[drag.i]=s2w_(px,py); update({fast:true}) }
  if(drag.type==="ramp"){ const w=s2w_(px,py); S.estudo.rampa.x=drag.x+w[0]-drag.start[0]; S.estudo.rampa.y=drag.y+w[1]-drag.start[1]; update({fast:true}) }
  if(drag.type==="img"){ const w=s2w_(px,py); BG.x=drag.bx+w[0]-drag.start[0]; BG.y=drag.by+w[1]-drag.start[1]; redraw2d() }
});
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
  if(drag && (VIEW==="gar"||VIEW==="andar") && drag.tap && !drag.moved && !RAMPMOVE) toggleVaga(drag.tap);
  if(drag&&(drag.type==="v"||drag.type==="ramp")){ update(); if(TAB==="terreno") renderTabLive(window._last.m, window._last.f) } drag=null };
c2.addEventListener("pointerup",endPtr); c2.addEventListener("pointercancel",endPtr);
c2.addEventListener("wheel",e=>{ e.preventDefault(); const [px,py]=pos(e); zoomAt(px,py, cur().s*Math.exp(-e.deltaY*0.0015)) },{passive:false});
function zoomAt(px,py,ns){ ns=Math.min(300,Math.max(0.2,ns)); const w=s2w_(px,py), V=cur(); V.s=ns; V.ox=px-w[0]*ns; V.oy=py+w[1]*ns; redraw2d() }
function toggleVaga(w){
  const m=window._last.m; let key=FLOOR;
  if(VIEW==="andar"){ const a=floorsList(m).find(f=>f.key===ANDAR); if(!a) return; key = a.tipo==="ter"? "ter" : a.lay; if(!key) return }
  const lay=m.gar&&m.gar[key]; if(!lay) return;
  const v=lay.vagas.find(v=>G.pip(w,v.poly)); if(!v) return;
  const E=S.estudo; E.vtipo=E.vtipo||{}; if(E.off&&E.off[v.key]){ delete E.off[v.key] }
  const alvo = TAPMODE; let msg;
  if(alvo==="off"){ if(v.tipo==="off"){ delete E.vtipo[v.key]; if(v.auto==="off"||v.auto==="faixa") E.vtipo[v.key]="n"; msg="Vaga devolvida" } else { E.vtipo[v.key]="off"; msg="Vaga removida" } }
  else { if(v.tipo===alvo){ delete E.vtipo[v.key]; msg="Marcação desfeita" } else { E.vtipo[v.key]=alvo; msg={n:"Agora é vaga comum",pcd:"Marcada como PCD",idoso:"Marcada para idoso"}[alvo] } }
  update(); toast(msg);
}
document.getElementById("calibOk").addEventListener("click",()=>{ const d=+document.getElementById("calibDist").value; if(BG && CAL && CAL.length===2 && d>0){ const meas=Math.hypot(CAL[1][0]-CAL[0][0],CAL[1][1]-CAL[0][1]); const k=d/meas, A=CAL[0]; BG.mpp*=k; BG.x=A[0]+(BG.x-A[0])*k; BG.y=A[1]+(BG.y-A[1])*k; toast("Escala calibrada. Agora desenhe o lote."); fitBG(); DRAWT="lote"; setTool("draw"); DRAW=[] } else if(!BG) toast("Envie uma imagem primeiro"); CAL=null; document.getElementById("calibBox").hidden=true; redraw2d() });
document.getElementById("calibCancel").addEventListener("click",()=>{ CAL=null; document.getElementById("calibBox").hidden=true; setTool("edit") });
function setTool(t, target){ TOOL=t; if(target) DRAWT=target; else if(t==="draw" && !target) DRAWT = DRAWT||"lote"; if(t!=="draw") DRAW=null; if(t!=="calib"){ CAL=null; document.getElementById("calibBox").hidden=true }
  document.querySelectorAll("#toolSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===t && (!b.dataset.dt || b.dataset.dt===DRAWT))); hintFor(); redraw2d() }
function hintFor(){ const h=document.getElementById("hint");

function loadScript(src){ return new Promise((ok,err)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("falha ao carregar "+src)); document.head.appendChild(s) }) }
async function aiReadPdf(e){
  const f=e.target.files[0], info=document.getElementById("aiPdfInfo"); if(!f) return;
  info.textContent="lendo PDF…";
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()), isEvalSupported:false}).promise;
    const pages=[];
    for(let i=1;i<=doc.numPages;i++){ const p=await doc.getPage(i); const tc=await p.getTextContent(); pages.push(tc.items.map(x=>x.str).join(" ")); if(i%10===0) info.textContent=`lendo PDF… ${i}/${doc.numPages}` }
    PDFTXT = pages.map((t,i)=>`[pág. ${i+1}] ${t}`).join("\n");
    info.textContent=`${doc.numPages} páginas · ${nf(PDFTXT.length/1000,0)} mil caracteres`;
  }catch(err){ info.textContent="Não consegui ler este PDF aqui. Cole o trecho da tabela no campo abaixo."; PDFTXT="" }
}
function pickRelevant(txt, zona, limit=150000){
  if(txt.length<=limit) return txt;
  const pages=txt.split(/\n(?=\[pág\. )/); const kws=["coeficiente","aproveitamento","taxa de ocupa","recuo","afastamento","gabarito","altura","permeab","vaga","estacionamento","outorga","subsolo","embasamento"];
  const zs=(zona||"").toLowerCase().split(/[\s,\/\-–]+/).filter(w=>w.length>=2);
  const score=p=>{ const l=p.toLowerCase(); let s=0; kws.forEach(k=>{ if(l.includes(k)) s+=1 }); zs.forEach(z=>{ const c=l.split(z).length-1; s+=Math.min(c,5)*2 }); return s };
  const ranked=pages.map((p,i)=>({p,i,s:score(p)})).sort((a,b)=>b.s-a.s); const out=[]; let n=0;
  for(const r of ranked){ if(n+r.p.length>limit) continue; out.push(r); n+=r.p.length }
  return out.sort((a,b)=>a.i-b.i).map(r=>r.p).join("\n");
}

const ascii = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7e]/g,"");
function DXF(){
  const ents=[], layers={};
  const fx=v=>(+v).toFixed(4);
  return {
    poly(layer, pts, color=7){ if(!pts||pts.length<2) return; layers[layer]=color; ents.push(`0\nPOLYLINE\n8\n${layer}\n66\n1\n70\n${pts.length>2?1:0}\n10\n0\n20\n0\n30\n0\n`+pts.map(q=>`0\nVERTEX\n8\n${layer}\n10\n${fx(q[0])}\n20\n${fx(q[1])}\n30\n0\n`).join("")+`0\nSEQEND\n8\n${layer}\n`) },
    text(layer, [x,y], h, s, color=7){ layers[layer]=color; ents.push(`0\nTEXT\n8\n${layer}\n10\n${fx(x)}\n20\n${fx(y)}\n30\n0\n40\n${h}\n1\n${ascii(s)}\n72\n1\n11\n${fx(x)}\n21\n${fx(y)}\n31\n0\n`) },
    out(){ const lt=Object.entries(layers); return `0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n9\n$INSUNITS\n70\n6\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n${lt.length}\n`+lt.map(([n,c])=>`0\nLAYER\n2\n${n}\n70\n0\n62\n${c}\n6\nCONTINUOUS\n`).join("")+`0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n`+ents.join("")+`0\nENDSEC\n0\nEOF\n` }
  };
}

      let nrm=new THREE.Vector3(0,1,0); if(Math.abs(t.y)>0.9) nrm.set(1,0,0); const bn=new THREE.Vector3().crossVectors(t,nrm).normalize(); nrm.crossVectors(bn,t).normalize();
      const taper=Math.min(1, i/6, (pts.length-1-i)/6)*0.8+0.2;
      for(let s_=0;s_<sides;s_++){ const ang=s_/sides*Math.PI*2, ca=Math.cos(ang)*r*taper, sa=Math.sin(ang)*r*taper; allP.push(pts[i][0]+nrm.x*ca+bn.x*sa, pts[i][2]+nrm.y*ca+bn.y*sa, pts[i][1]+nrm.z*ca+bn.z*sa); allC.push(...cols[i]) }
      if(i>0) for(let s_=0;s_<sides;s_++){ const s2=(s_+1)%sides, p0=base+(i-1)*sides+s_, p1=base+(i-1)*sides+s2, p2=base+i*sides+s_, p3=base+i*sides+s2; allI.push(p0,p2,p1, p1,p2,p3) }
    }
    base+=pts.length*sides;
  });
  const dark=S.cfd.fundo!=="claro";
  if(tube && allP.length){ const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(allP,3)); g.setAttribute("color",new THREE.Float32BufferAttribute(allC,3)); g.setIndex(allI); g.computeVertexNormals(); grp.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.35, metalness:0.1}))) }
  if(!tube && lp.length){ const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(lp,3)); g.setAttribute("acol",new THREE.Float32BufferAttribute(lc,3)); g.setAttribute("tof",new THREE.Float32BufferAttribute(lt,1));
    CFD.slMat=new THREE.ShaderMaterial({vertexShader:SL_VS, fragmentShader:SL_FS, transparent:true, depthWrite:false, blending: dark? THREE.AdditiveBlending : THREE.NormalBlending,
      uniforms:{uTime:{value:0}, uPeriod:{value: Math.max(2,(CFD.dom.x1-CFD.dom.x0)/S.clima.ventoVel/4)}, uBase:{value: dark? 0.22 : 0.35}, uGlow:{value: dark? 0.95 : 0.75}}});
    const ls=new THREE.LineSegments(g,CFD.slMat); ls.frustumCulled=false; ls.renderOrder=4; grp.add(ls) } else CFD.slMat=null;
  CFD.lines=grp; CFD.grp.add(grp); CFD.lastLines=performance.now();
}
/* ---------- partículas e fumaça ---------- */
const PT_VS=`attribute float size; attribute float alpha; attribute vec3 acol; varying vec3 vC; varying float vA; void main(){ vC=acol; vA=alpha; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize=size*(320.0/-mv.z); gl_Position=projectionMatrix*mv; }`;
const PT_FS=`varying vec3 vC; varying float vA; void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); if(r>0.5) discard; float a=vA*pow(smoothstep(0.5,0.0,r),1.6); gl_FragColor=vec4(vC*(0.85+0.3*(0.5-r)),a); }`;
function cfdParticlesInit(){
  disposeObj(CFD.pts); disposeObj(CFD.trails); CFD.pts=null; CFD.trails=null; CFD.parts=null;
  const on=S.cfd.viz.particulas||S.cfd.viz.fumaca; if(!on || !CFD.dom) return;
  const n=S.cfd.viz.fumaca && !S.cfd.viz.particulas? S.cfd.fumacaN : S.cfd.partN;
  const P={n, x:new Float32Array(n), y:new Float32Array(n), z:new Float32Array(n), age:new Float32Array(n), life:new Float32Array(n), smoke:new Uint8Array(n)};
  for(let i=0;i<n;i++){ cfdSpawn(P,i); P.age[i]=Math.random()*P.life[i] }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(3*n),3)); g.setAttribute("acol",new THREE.BufferAttribute(new Float32Array(3*n),3)); g.setAttribute("size",new THREE.BufferAttribute(new Float32Array(n),1)); g.setAttribute("alpha",new THREE.BufferAttribute(new Float32Array(n),1));
  CFD.pts=new THREE.Points(g,new THREE.ShaderMaterial({vertexShader:PT_VS,fragmentShader:PT_FS,transparent:true,depthWrite:false,blending: S.cfd.fundo!=="claro" && !S.cfd.viz.fumaca? THREE.AdditiveBlending : THREE.NormalBlending})); CFD.pts.frustumCulled=false; CFD.pts.renderOrder=3; CFD.grp.add(CFD.pts);
  if(S.cfd.rastro){ const tg=new THREE.BufferGeometry(); tg.setAttribute("position",new THREE.BufferAttribute(new Float32Array(6*n),3)); tg.setAttribute("color",new THREE.BufferAttribute(new Float32Array(6*n),3)); CFD.trails=new THREE.LineSegments(tg,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.8,blending: S.cfd.fundo!=="claro"? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite:false})); CFD.trails.frustumCulled=false; CFD.grp.add(CFD.trails) }
  CFD.parts=P;
}
function cfdEmitTop(){ const d=CFD.dom; return Math.min(d.ztop*0.85, d.Hmax*1.25) }
function cfdEmitter(){ const d=CFD.dom, e=S.cfd.emissor; if(e){ return [e[0]*d.f[0]+e[1]*d.f[1], e[0]*d.pp[0]+e[1]*d.pp[1], e[2]] } return [d.bx0-d.Hmax*0.6, (d.by0+d.by1)/2, Math.min(d.Hmax*0.5, 12)] }
function cfdSpawn(P,i){
  const d=CFD.dom, c=S.cfd; const smoke = c.viz.fumaca && (!c.viz.particulas || Math.random()<0.35);
  P.smoke[i]=smoke?1:0; P.age[i]=0;
  if(smoke){ const [ex,ey,ez]=cfdEmitter(), r=d.dx*0.5, tipo=c.emissorTipo||"linha", top=cfdEmitTop();
    if(tipo==="ponto"){ P.x[i]=ex+(Math.random()-0.5)*r; P.y[i]=ey+(Math.random()-0.5)*r; P.z[i]=Math.max(0.3,ez+(Math.random()-0.5)*r) }
    else if(tipo==="linha"){ P.x[i]=ex+(Math.random()-0.5)*r; P.y[i]=ey+(Math.random()-0.5)*r; P.z[i]=0.4+Math.random()*(top-0.4) }
    else { const w=(d.by1-d.by0)*1.3, yc=(d.by0+d.by1)/2; P.x[i]=(c.emissor? ex : d.bx0-d.Hmax*0.5)+(Math.random()-0.5)*r; P.y[i]=yc+(Math.random()-0.5)*w; P.z[i]=0.4+Math.random()*(top-0.4) }
    P.life[i]=10+Math.random()*12 }
  else { P.x[i]=d.x0+d.dx*(0.5+Math.random()*2); P.y[i]=d.by0-(d.by1-d.by0)*0.25+Math.random()*(d.by1-d.by0)*1.5; P.z[i]=0.5+Math.pow(Math.random(),1.6)*d.Hmax*1.4; P.life[i]=14+Math.random()*16 }
}
function cfdParticlesStep(dt){
  const P=CFD.parts; if(!P||!CFD.field) return; const d=CFD.dom, c=S.cfd, U=S.clima.ventoVel, k=dt*c.animVel, v=c.var;
  const pa=CFD.pts.geometry.attributes, pos=pa.position.array, col=pa.acol.array, sz=pa.size.array, al=pa.alpha.array;
  const tr=CFD.trails? CFD.trails.geometry.attributes : null;
  for(let i=0;i<P.n;i++){
    let x=P.x[i], y=P.y[i], z=P.z[i]; const vv=cfdVel(x,y,z); let sp=Math.hypot(...vv);
    x+=vv[0]*k; y+=vv[1]*k; z+=vv[2]*k;
    if(P.smoke[i]){ const turb=(CFD.field.rms? tri(CFD.field.rms,...cfdIdx(x,y,z))*cfdScale() : U*0.15)*0.9+U*0.04; const j=turb*Math.sqrt(k); x+=(Math.random()-0.5)*j; y+=(Math.random()-0.5)*j; z+=(Math.random()-0.5)*j }
    P.age[i]+=k; if(z<0.2) z=0.2;
    if(!cfdInside(x,y,z) || cfdSolid(x,y,z) || P.age[i]>P.life[i]){ cfdSpawn(P,i); x=P.x[i]; y=P.y[i]; z=P.z[i]; sp=U }
    P.x[i]=x; P.y[i]=y; P.z[i]=z;
    pos[3*i]=x; pos[3*i+1]=z; pos[3*i+2]=y;
    const t=P.age[i]/P.life[i];
    let cc;
    if(P.smoke[i] && !c.fumacaCor){ const g_= c.fundo!=="claro"? 0.92-0.25*t : 0.40+0.36*t; cc=[g_*255,g_*262>255?255:g_*262,g_*270>255?255:g_*270] } else cc=cfdColor(v==="cp"||v==="lawson"||v==="ti"||v==="vort"||v==="media"? "vel":v, v==="w"? vv[2] : sp);
    col[3*i]=cc[0]/255; col[3*i+1]=cc[1]/255; col[3*i+2]=cc[2]/255;
    if(P.smoke[i]){ sz[i]=(1.0+t*4.5)*Math.max(1.2,d.dx*0.8)*c.partTam; al[i]=0.34*(1-t)*(t<0.05? t/0.05:1) } else { sz[i]=0.45*c.partTam*Math.max(0.6,d.dx*0.5); al[i]=0.9*Math.min(1,(1-t)*4)*Math.min(1,P.age[i]*3) }
    if(tr){ const L= P.smoke[i]? 0 : c.rastroLen; const tp=tr.position.array, tc=tr.color.array; tp[6*i]=x; tp[6*i+1]=z; tp[6*i+2]=y; tp[6*i+3]=x-vv[0]*L; tp[6*i+4]=z-vv[2]*L; tp[6*i+5]=y-vv[1]*L; for(let q=0;q<3;q++){ tc[6*i+q]=col[3*i+q]; tc[6*i+3+q]=col[3*i+q]*0.3 } }
  }
  pa.position.needsUpdate=true; pa.acol.needsUpdate=true; pa.size.needsUpdate=true; pa.alpha.needsUpdate=true;
  if(tr){ tr.position.needsUpdate=true; tr.color.needsUpdate=true }
}
/* ---------- atualização ---------- */
function cfdRefresh(all){
  if(!CFD.dom || !V3.R) return;
  cfdSlice(); cfdArrows(); cfdColorBuildings();
  if(all || performance.now()-CFD.lastLines>2500) cfdLines();
  if(all) cfdParticlesInit();
  cfdLegend(); render3();
}
function cfdOnField(){ if(VIEW!=="v3d") return; cfdRefresh(false); cfdStatus(); if(CFD.probe) cfdProbeAt(CFD.probe.pt) }
function cfdLoop(){
  if(VIEW!=="v3d"){ CFD.raf=null; return }
  const now=performance.now(), dt=Math.min(0.05,(now-(CFD.t||now))/1000); CFD.t=now;
  let draw=false; if(CFD.parts){ cfdParticlesStep(dt); draw=true }
  if(CFD.slMat){ CFD.slMat.uniforms.uTime.value+=dt*S.cfd.animVel; draw=true }
  if(draw) render3();
  CFD.raf=requestAnimationFrame(cfdLoop);
}
function cfdBuildings(){ // prédio com o mesmo render do 3D (materiais, pavimentos, sombras)
  const corte=S.corte; S.corte=""; rebuild3d(window._last.m,true); S.corte=corte; V3.grp.visible=true;
  const dark=S.cfd.fundo!=="claro"; stageBackdrop(dark); V3.scene.fog=null;
  V3.grp.children.forEach(o=>{ if(o.isMesh && o.geometry && o.geometry.type==="CircleGeometry") o.visible=!dark; if(o.isGridHelper) o.visible=!dark;
    if(S.cfd.vidro && o.isMesh && o.geometry && o.geometry.type==="ExtrudeGeometry"){ o.material.transparent=true; o.material.opacity=Math.min(o.material.opacity,0.32); o.material.depthWrite=false; o.castShadow=false } });
  V3.sun.castShadow=!S.cfd.vidro; render3();
}
function cfdEnter(){
  if(!V3.R) return; V3.clip=[]; if(V3.sunGrp) V3.sunGrp.visible=false;
  const dark=S.cfd.fundo!=="claro"; V3.R.toneMappingExposure= dark? 1.0 : 0.92; cfdBuildings();
  const m=window._last.m, d=cfdDomain(S,m);
  if(!CFD.dom || CFD.sig!==d.sig){ cfdStart(true) } else { cfdGroup(); if(!CFD.bld) cfdBuildStatic(); CFD.grp.visible=true; cfdRefresh(true); cfdFit() }
  if(CFD.grp) CFD.grp.visible=true;
  document.getElementById("cfdBar").hidden=false; document.getElementById("cfdLegend").hidden=false;
  cfdBarUI(); cfdStatus(); if(!CFD.raf) CFD.raf=requestAnimationFrame(cfdLoop);
}
function cfdLeave(){ if(V3.R) V3.R.toneMappingExposure=0.92; if(CFD.grp) CFD.grp.visible=false; if(V3.grp) V3.grp.visible=true; if(CFD.raf){ cancelAnimationFrame(CFD.raf); CFD.raf=null } document.getElementById("cfdBar").hidden=true; document.getElementById("cfdLegend").hidden=true; document.getElementById("cfdProbe").hidden=true; if(CFD.running) cfdPause(); applySun() }
function cfdStatus(msg){
  const el=document.getElementById("cfdStat"), el2=document.getElementById("cfdStat2"); const F=CFD.field, d=CFD.dom;
  const txt = msg || (!F? "Preparando a malha…" : `${CFD.running?"Simulando":"Pausado"} · passo ${nf(F.step,0)} · ${F.navg>2? "médias com "+nf(F.navg,0)+" amostras" : pct(Math.min(1,F.step/(1.2*d.nx/0.085)),0)+" até o regime"} · ${d.nx}×${d.ny}×${d.nz} células de ${nf(d.dx,1)} m`);
  if(el) el.textContent=txt; if(el2) el2.textContent=txt;
}
function cfdLegend(){
  const el=document.getElementById("cfdLegend"); if(!el) return; const v=S.cfd.var, [a,b]=cfdRange(v);
  const unit = v==="vel"||v==="media"||v==="w"? " m/s" : v==="vort"? " 1/s" : v==="ti"? "" : "";
  if(v==="lawson"){ el.innerHTML=`<b>${CFD_VARS[v]}</b>`+LAWSON.map((l,i)=>`<div class="lw"><i style="background:rgb(${l[1]})"></i>${i===0?"&lt; 2":i===4?"&gt; 8":(LAWSON[i-1][0])+"–"+l[0]} m/s · ${l[2]}</div>`).join("")+`<div class="lnote">velocidade média a ${nf(S.cfd.plano.h,1)} m</div>`; return }
  const stops=v==="w"||v==="cp"? DIVERG : TURBO;
  el.innerHTML=`<b>${CFD_VARS[v]}</b><div class="cbar" style="background:linear-gradient(90deg,${stops.map(s=>`rgb(${s[1]}) ${s[0]*100}%`).join(",")})"></div><div class="cl"><span>${nf(a,v==="ti"||v==="cp"?1:1)}${unit}</span><span>${nf((a+b)/2,1)}</span><span>${nf(b,1)}${unit}</span></div>${v==="ti"?'<div class="lnote">desvio da velocidade ÷ vento de referência</div>':v==="cp"?'<div class="lnote">+ pressão (barlavento) · − sucção</div>':""}`;
}
/* ---------- sonda ---------- */
const RAY=new THREE.Raycaster();
function cfdPick(px,py){
  if(!CFD.grp||!CFD.field) return; const r=document.getElementById("c3d").getBoundingClientRect();
  RAY.setFromCamera(new THREE.Vector2((px/r.width)*2-1, -(py/r.height)*2+1), V3.cam);
  const objs=[CFD.slice, CFD.bld, CFD.ground].filter(Boolean); const hit=RAY.intersectObjects(objs,false)[0]; if(!hit) return;
  const inv=new THREE.Matrix4().copy(CFD.grp.matrix).invert(); const p=hit.point.clone().applyMatrix4(inv);
  let pt=[p.x, p.z, Math.max(0.5,p.y)];
  if(hit.object===CFD.bld && hit.face){ const n=hit.face.normal; pt=[pt[0]+n.x*CFD.dom.dx*0.9, pt[1]+n.z*CFD.dom.dx*0.9, Math.max(0.5,pt[2]+n.y*CFD.dom.dx*0.9)] }
  if(hit.object===CFD.ground) pt[2]=1.5;
  cfdProbeAt(pt);
}
function cfdProbeAt(pt){
  CFD.probe={pt}; const [x,y,z]=pt, F=CFD.field, U=S.clima.ventoVel, v=cfdVel(x,y,z), vm=F.mean? cfdVel(x,y,z,true) : null;
  const sp=Math.hypot(...v), smean=vm? Math.hypot(...vm) : null, cp=cfdValue("cp",x,y,z), ti=F.rms? cfdValue("ti",x,y,z) : null;
  const d=CFD.dom, wx=v[0]*d.f[0]+v[1]*d.pp[0], wy=v[0]*d.f[1]+v[1]*d.pp[1]; const th=(S.lote.norte||0)*Math.PI/180, north=[Math.sin(th),Math.cos(th)], east=[Math.cos(th),-Math.sin(th)];
  const az=(Math.atan2(wx*east[0]+wy*east[1], wx*north[0]+wy*north[1])*180/Math.PI+360)%360, rosa=["N","NE","L","SE","S","SO","O","NO"][Math.round(az/45)%8];
  const lw = smean!=null? LAWSON.find(l=>smean<l[0]) : null;
  const el=document.getElementById("cfdProbe"); el.hidden=false;
  el.innerHTML=`<div class="hd"><b>Sonda · ${nf(z,1)} m de altura</b><button class="btn sm" id="pbX" aria-label="Fechar">×</button></div>
    <table class="tbl"><tr><td>Velocidade agora</td><td>${nf(sp,1)} m/s (${nf(sp/U,2)}×)</td></tr>${smean!=null?`<tr><td>Velocidade média</td><td>${nf(smean,1)} m/s</td></tr>`:""}
    <tr><td>Indo para</td><td>${rosa} · ${nf(az,0)}°</td></tr><tr><td>Componente vertical</td><td>${nf(v[2],2)} m/s</td></tr>
    ${ti!=null?`<tr><td>Turbulência</td><td>${pct(ti,0)}</td></tr>`:""}<tr><td>Pressão (Cp)</td><td>${nf(cp,2)}</td></tr>${lw?`<tr><td>Conforto (Lawson aprox.)</td><td>${lw[2]}</td></tr>`:""}</table>
    <div class="row" style="margin:6px 0 0"><button class="btn sm" id="pbSmoke">Soltar fumaça aqui</button><button class="btn sm" id="pbSeed">Linhas a partir daqui</button></div>`;
  const toW=()=>[x*d.f[0]+y*d.pp[0], x*d.f[1]+y*d.pp[1], z];
  document.getElementById("pbX").onclick=()=>{ el.hidden=true; CFD.probe=null; disposeObj(CFD.probeMk); CFD.probeMk=null; render3() };
  document.getElementById("pbSmoke").onclick=()=>{ S.cfd.emissor=toW(); S.cfd.viz.fumaca=true; save(); cfdParticlesInit(); cfdBarUI(); if(TAB==="clima") renderTab(); toast("Fumaça solta neste ponto") };
  document.getElementById("pbSeed").onclick=()=>{ S.cfd.semente=toW(); S.cfd.viz.linhas=true; save(); cfdLines(); cfdBarUI(); render3(); toast("Linhas de corrente passando por este ponto") };
  disposeObj(CFD.probeMk); const mk=new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.4,d.dx*0.35),12,10), new THREE.MeshBasicMaterial({color:0x111111})); mk.position.copy(LV(x,y,z)); CFD.probeMk=mk; CFD.grp.add(mk); render3();
}
/* ---------- barra flutuante ---------- */
const CFD_VIZ=[["linhas","Linhas"],["particulas","Partículas"],["fumaca","Fumaça"],["setas","Setas"],["plano","Plano de cor"],["pressao","Pressão nas fachadas"]];
function cfdBarUI(){
  const bar=document.getElementById("cfdBar"); if(!bar) return;
  bar.innerHTML=`<div class="row" style="margin:0;gap:6px;flex-wrap:nowrap"><button class="btn sm ${CFD.running?"":"pri"}" id="cfPlay">${CFD.running?"Pausar":"Simular"}</button><button class="btn sm" id="cfReset" title="Recomeçar a simulação">Reiniciar</button>
    <select id="cfVar" aria-label="Colorir por">${Object.entries(CFD_VARS).map(([k,l])=>`<option value="${k}" ${S.cfd.var===k?"selected":""}>${l}</option>`).join("")}</select>
    <span class="cfchips">${CFD_VIZ.filter(([k])=>S.cfd.viz[k]).map(([k,l])=>`<span class="pill">${l}</span>`).join("")}</span></div>
    <div class="cfstat" id="cfdStat"></div>`;
  document.getElementById("cfPlay").onclick=()=>{ CFD.running? cfdPause() : (CFD.worker? cfdRun() : cfdStart()); if(TAB==="clima") renderTab() };

  document.getElementById("cfVar").onchange=e=>{ S.cfd.var=e.target.value; if(S.cfd.var==="lawson"){ S.cfd.viz.plano=true; S.cfd.plano.orient="h"; S.cfd.plano.h=1.5 } save(); cfdRefresh(true); cfdBarUI(); if(TAB==="clima") renderTab() };

}

document.getElementById("pdfTop").addEventListener("click",()=>exportPDF());
// tema claro / escuro (lembra a escolha; sem escolha segue o sistema)
